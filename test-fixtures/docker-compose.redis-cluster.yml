# Redis Cluster test rig (M36) — 3 masters + 3 replicas over the real 16384
# hash slots. `make db-up` starts and seeds this alongside everything else, and
# `make db-down` wipes it.
#
# It is its own compose file + project name rather than six more services in
# docker-compose.yml because a cluster is a different THING from the standalone
# Redis on 63790, not more of it: the nodes need their own shared network
# namespace (see below), their own seed step that forms the cluster before it
# can hold a key, and they must be startable on their own while iterating.
#
#   make redis-cluster-up            # just this rig: up + form + seed
#   make redis-cluster-down          # just this rig: stop + wipe
#
#   # or, by hand:
#   cd test-fixtures
#   docker compose -p bytetable-rediscluster -f docker-compose.redis-cluster.yml up -d
#   ./seed/seed-redis-cluster.sh     # forms the cluster + seeds keys across shards
#   docker compose -p bytetable-rediscluster -f docker-compose.redis-cluster.yml down -v
#
# ByteTable connection — any node works; the workspace detects cluster mode from
# the server's own `redis_mode:cluster` and reads the topology with CLUSTER
# NODES / SHARDS / INFO:
#
#   Host 127.0.0.1 · Port 7001 (or 7002…7006) · DB index 0 · Password bytetable
#
# ---------------------------------------------------------------------------
# Why all six nodes share ONE network namespace
# ---------------------------------------------------------------------------
# A cluster client must be able to reach every node at the address the cluster
# ANNOUNCES, and so must the nodes themselves (gossip over the bus port). Those
# two requirements normally conflict on Docker Desktop:
#
#   - Announce container IPs (172.x) and gossip works, but the macOS/Windows
#     host cannot route to them — ByteTable's per-node INFO probes all fail and
#     the shard cards show "—" for keys/memory/ops.
#   - Announce 127.0.0.1 with per-node ports and the host is happy, but each
#     container's 127.0.0.1 is its own loopback, so the nodes gossip with
#     themselves and never form a cluster.
#
# Putting every node in a SINGLE network namespace resolves both: inside that
# namespace 127.0.0.1:7001…7006 really are the six servers, and the namespace
# owner publishes those same ports to the host 1:1. The announced address is
# then correct from both sides. `redis-net` owns the namespace (it is just an
# idle container from the same image — no extra pull) so a node restart never
# takes the network down with it.
#
# Node 6 is deliberately given a lower `cluster-node-timeout` so it is the first
# to be flagged if you pause it (`docker pause bt-rc-6`) — that is how you make
# the dashboard's PFAIL warning and "shard has no healthy replica" appear.

services:
  # Owns the network namespace and publishes every node's client + bus port.
  redis-net:
    image: redis:7
    container_name: bt-rc-net
    command: ["sleep", "infinity"]
    ports:
      - "7001:7001"
      - "7002:7002"
      - "7003:7003"
      - "7004:7004"
      - "7005:7005"
      - "7006:7006"
      # Cluster bus = client port + 10000. Published so the host can see the
      # gossip ports too (handy when debugging with redis-cli --cluster).
      - "17001:17001"
      - "17002:17002"
      - "17003:17003"
      - "17004:17004"
      - "17005:17005"
      - "17006:17006"

  redis-1: &cluster-node
    image: redis:7
    container_name: bt-rc-1
    network_mode: "service:redis-net"
    depends_on: [redis-net]
    command:
      - redis-server
      - --port
      - "7001"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      # Announce the address the host dials, which inside the shared namespace
      # is also the address the other nodes reach.
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "7001"
      - --cluster-announce-bus-port
      - "17001"
      - --requirepass
      - bytetable
      # Replicas authenticate to their master with the same password.
      - --masterauth
      - bytetable
      - --appendonly
      - "yes"
    volumes:
      - bt-rc-1-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7001 -a bytetable --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis-2:
    <<: *cluster-node
    container_name: bt-rc-2
    command:
      - redis-server
      - --port
      - "7002"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "7002"
      - --cluster-announce-bus-port
      - "17002"
      - --requirepass
      - bytetable
      - --masterauth
      - bytetable
      - --appendonly
      - "yes"
    volumes:
      - bt-rc-2-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7002 -a bytetable --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis-3:
    <<: *cluster-node
    container_name: bt-rc-3
    command:
      - redis-server
      - --port
      - "7003"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "7003"
      - --cluster-announce-bus-port
      - "17003"
      - --requirepass
      - bytetable
      - --masterauth
      - bytetable
      - --appendonly
      - "yes"
    volumes:
      - bt-rc-3-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7003 -a bytetable --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis-4:
    <<: *cluster-node
    container_name: bt-rc-4
    command:
      - redis-server
      - --port
      - "7004"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "7004"
      - --cluster-announce-bus-port
      - "17004"
      - --requirepass
      - bytetable
      - --masterauth
      - bytetable
      - --appendonly
      - "yes"
    volumes:
      - bt-rc-4-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7004 -a bytetable --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  redis-5:
    <<: *cluster-node
    container_name: bt-rc-5
    command:
      - redis-server
      - --port
      - "7005"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "7005"
      - --cluster-announce-bus-port
      - "17005"
      - --requirepass
      - bytetable
      - --masterauth
      - bytetable
      - --appendonly
      - "yes"
    volumes:
      - bt-rc-5-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7005 -a bytetable --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # Shorter node timeout: pause this container and it is the first to be
  # flagged PFAIL, which is how you exercise the health panel's warnings.
  redis-6:
    <<: *cluster-node
    container_name: bt-rc-6
    command:
      - redis-server
      - --port
      - "7006"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - /data/nodes.conf
      - --cluster-node-timeout
      - "3000"
      - --cluster-announce-ip
      - 127.0.0.1
      - --cluster-announce-port
      - "7006"
      - --cluster-announce-bus-port
      - "17006"
      - --requirepass
      - bytetable
      - --masterauth
      - bytetable
      - --appendonly
      - "yes"
    volumes:
      - bt-rc-6-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -p 7006 -a bytetable --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  bt-rc-1-data:
  bt-rc-2-data:
  bt-rc-3-data:
  bt-rc-4-data:
  bt-rc-5-data:
  bt-rc-6-data:
