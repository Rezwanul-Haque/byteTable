<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ByteTable — interactive demo</title>
<meta name="robots" content="noindex" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block" rel="stylesheet" />
<style>
  :root {
    --bg0: #131418; --bg1: #191b20; --bg2: #20232a; --bg3: #282c35;
    --border: #2c3039;
    --text: #e3e6eb; --text-dim: #9aa1ad; --text-faint: #5d6470;
    --accent: #2dd4a7;
    --danger: #e06c75;
    --warn: #e2b340;
    --change: #61afef;
    --on-accent: #0c1512;
    --grid-row-h: 26px; --grid-fs: 12px;
    --ui-script: ;
    --ui: var(--ui-script) 'IBM Plex Sans', system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body, #root { height: 100%; }
  body {
    font-family: var(--ui); background: var(--bg0); color: var(--text);
    font-size: 13px; overflow: hidden; -webkit-font-smoothing: antialiased;
  }
  /* splash screen */
  #bt-splash {
    position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: radial-gradient(900px 560px at 50% 38%, #1b1e24, #131418 72%);
    transition: opacity .45s ease, visibility .45s; gap: 0;
  }
  #bt-splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
  .splash-inner { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .splash-logo { filter: drop-shadow(0 8px 28px color-mix(in srgb, var(--accent) 35%, transparent)); }
  .splash-logo .sl-row { transform-box: fill-box; transform-origin: left center; animation: sl-row-in .5s cubic-bezier(.2,.8,.2,1) backwards; }
  .splash-logo .sl-a { animation-delay: .05s; }
  .splash-logo .sl-b { animation-delay: .14s; }
  .splash-logo .sl-c { animation-delay: .23s; }
  .splash-logo .sl-d { animation-delay: .32s; }
  .splash-logo .sl-cursor { transform-box: fill-box; transform-origin: center; animation: sl-cursor 1s steps(2) .6s infinite; }
  @keyframes sl-row-in { from { transform: scaleX(0); opacity: 0; } to { transform: scaleX(1); opacity: 1; } }
  @keyframes sl-cursor { 50% { opacity: .2; } }
  .splash-word { font-size: 26px; font-weight: 600; letter-spacing: -.01em; opacity: 0; animation: sl-fade .5s ease .42s forwards; }
  .splash-accent { color: var(--accent); }
  .splash-tag { font-size: 12.5px; color: var(--text-dim); opacity: 0; animation: sl-fade .5s ease .52s forwards; }
  .splash-bar { width: 168px; height: 3px; border-radius: 2px; background: var(--bg3); overflow: hidden; margin-top: 8px; opacity: 0; animation: sl-fade .4s ease .6s forwards; }
  .splash-bar span { display: block; height: 100%; width: 40%; border-radius: 2px; background: var(--accent); animation: sl-load 1.1s ease-in-out infinite; }
  @keyframes sl-load { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }
  .splash-foot { position: absolute; bottom: 26px; font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); opacity: 0; animation: sl-fade .5s ease .7s forwards; }
  @keyframes sl-fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .splash-logo .sl-row, .splash-word, .splash-tag, .splash-bar, .splash-foot { animation: none; opacity: 1; } .splash-logo .sl-row { transform: none; } }
  .msym {
    font-family: 'Material Symbols Rounded'; font-weight: normal; font-style: normal;
    line-height: 1; letter-spacing: normal; text-transform: none; display: inline-block;
    white-space: nowrap; word-wrap: normal; direction: ltr; user-select: none;
    vertical-align: middle;
  }
  input, textarea, button { font-family: inherit; color: inherit; }
  button { cursor: pointer; background: none; border: none; }
  ::selection { background: color-mix(in oklab, var(--accent) 35%, transparent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--bg3); border-radius: 5px; border: 2px solid var(--bg0); }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }
  ::-webkit-scrollbar-corner { background: transparent; }

  /* ---------- buttons ---------- */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 8px; font-size: 12.5px; font-weight: 500;
    transition: background .12s, filter .12s; white-space: nowrap;
  }
  .btn-small { padding: 5px 11px; font-size: 12px; border-radius: 7px; }
  .btn-filled { background: var(--accent); color: var(--on-accent); }
  .btn-filled:hover { filter: brightness(1.1); }
  .btn-filled:disabled { opacity: .5; cursor: default; }
  .btn-tonal { background: color-mix(in oklab, var(--accent) 14%, var(--bg2)); color: var(--accent); }
  .btn-tonal:hover { background: color-mix(in oklab, var(--accent) 22%, var(--bg2)); }
  .btn-text { color: var(--text-dim); }
  .btn-text:hover { background: var(--bg2); color: var(--text); }
  .icon-btn {
    display: inline-flex; align-items: center; justify-content: center;
    width: 26px; height: 26px; border-radius: 6px; color: var(--text-faint);
    transition: background .12s, color .12s; flex: none;
  }
  .icon-btn:hover { background: var(--bg3); color: var(--text); }
  .icon-btn.active { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--accent); }
  .icon-btn.danger:hover { background: #e06c7522; color: #e06c75; }

  .kbd {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    background: var(--bg3); border: 1px solid var(--border); border-bottom-width: 2px;
    border-radius: 4px; padding: 1px 5px; vertical-align: 1px;
  }
  .engine-badge {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 7px; font-family: var(--mono); font-weight: 600; flex: none;
  }
  .env-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex: none; }
  .env-tag {
    font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; padding: 1px 6px; border-radius: 99px; border: 1px solid;
  }
  .tag {
    font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .05em;
    padding: 1px 5px; border-radius: 4px; background: var(--bg3); color: var(--text-dim);
  }
  .tag-accent { background: color-mix(in oklab, var(--accent) 16%, transparent); color: var(--accent); }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%; flex: none;
    border: 2px solid var(--bg3); border-top-color: var(--accent);
    animation: spin .7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- connect screen ---------- */
  .connect-screen {
    flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; background:
      radial-gradient(800px 500px at 50% -10%, color-mix(in oklab, var(--accent) 7%, transparent), transparent 70%),
      var(--bg0);
  }
  .connect-panel {
    width: 508px; max-width: calc(100vw - 48px);
    max-height: calc(100vh - 48px);
    background: var(--bg1); border: 1px solid var(--border); border-radius: 16px;
    padding: 28px; display: flex; flex-direction: column; gap: 18px;
    box-shadow: 0 24px 60px rgba(0,0,0,.45);
  }
  .connect-brand { display: flex; align-items: center; gap: 14px; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 13px; display: flex; align-items: center; justify-content: center;
    background: color-mix(in oklab, var(--accent) 18%, var(--bg2)); color: var(--accent);
  }
  .connect-brand h1 { font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
  .connect-brand-accent { color: var(--accent); }
  .connect-brand p { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
  .connect-list-label {
    font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em;
    color: var(--text-faint); display: flex; align-items: center; gap: 8px;
  }
  .connect-list-count { font-family: var(--mono); background: var(--bg2); border-radius: 99px; padding: 1px 8px; font-size: 10px; }
  .connect-search {
    display: flex; align-items: center; gap: 8px; background: var(--bg0); border: 1px solid var(--border);
    border-radius: 9px; padding: 0 8px 0 11px; transition: border-color .12s;
  }
  .connect-search:focus-within { border-color: var(--accent); }
  .connect-search input { flex: 1; background: none; border: none; outline: none; font-size: 13px; padding: 9px 0; min-width: 0; color: var(--text); }
  .connect-group-label { display: flex; align-items: center; gap: 6px; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; padding: 6px 2px 1px; }
  .connect-group-dot { width: 6px; height: 6px; border-radius: 50%; }
  .connect-group-n { color: var(--text-faint); font-family: var(--mono); }
  .proj-group { color: var(--text-dim); padding: 9px 2px 2px; }
  .proj-group-name { font-weight: 600; }
  .proj-acc { border: 1px solid var(--border); border-radius: 10px; background: var(--bg1); overflow: hidden; flex: none; }
  .proj-acc + .proj-acc { margin-top: 6px; }
  .proj-acc-head { display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 11px; font-size: 12.5px; color: var(--text-dim); cursor: pointer; }
  .proj-acc-head:hover { color: var(--text); background: var(--bg2); }
  .proj-acc.open > .proj-acc-head { color: var(--text); }
  .proj-acc .proj-group-name { flex: 1; text-align: left; }
  .proj-acc-body { padding: 4px 8px 8px; display: flex; flex-direction: column; gap: 6px; }
  .proj-filter { position: relative; }
  .proj-filter-btn { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-dim); background: var(--bg2); border: 1px solid var(--border); border-radius: 7px; padding: 3px 8px; text-transform: none; letter-spacing: 0; font-weight: 500; }
  .proj-filter-btn:hover { color: var(--text); border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .proj-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 40; min-width: 180px; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 12px 32px rgba(0,0,0,.45); padding: 5px; }
  .proj-pop-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 9px; border-radius: 6px; font-size: 12px; color: var(--text-dim); cursor: pointer; text-transform: none; letter-spacing: 0; }
  .proj-pop-item:hover { background: var(--bg3); color: var(--text); }
  .proj-pop-item.on { color: var(--accent); }
  .proj-pop-n { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .proj-select { position: relative; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field-label { font-size: 11.5px; color: var(--text-dim); font-weight: 500; }
  .opt-tag { font-size: 9.5px; color: var(--text-faint); font-weight: 400; font-style: italic; margin-left: 4px; }
  .lbl-row { display: flex; align-items: baseline; gap: 6px; }
  .lbl-row .opt-tag { margin-left: 0; }
  .proj-select-btn { display: flex; align-items: center; gap: 7px; width: 100%; background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 7px 9px; font-size: 12px; color: var(--text); }
  .proj-select-btn:hover { border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .proj-select-val { flex: 1; text-align: left; font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .proj-select-val.empty { color: var(--text-faint); }
  .proj-dd { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 60; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 14px 36px rgba(0,0,0,.5); padding: 5px; max-height: 230px; overflow-y: auto; }
  .proj-dd-item { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 6px; font-family: var(--mono); font-size: 12px; color: var(--text-dim); cursor: pointer; }
  .proj-dd-item:hover { background: var(--bg3); color: var(--text); }
  .proj-dd-item.on { color: var(--accent); }
  .proj-dd-item.create { color: var(--accent); }
  .proj-dd-sep { height: 1px; background: var(--border); margin: 4px 2px; }
  .proj-dd-add { display: flex; align-items: center; gap: 5px; padding: 3px; }
  .proj-dd-add input { flex: 1; background: var(--bg0); border: 1px solid var(--accent); border-radius: 7px; padding: 6px 9px; font-size: 12px; font-family: var(--mono); outline: none; color: var(--text); }
  .proj-dd-addbtn { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 7px; background: var(--accent); color: var(--on-accent); flex: none; }
  .proj-input { width: 100%; }
  .proj-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
  .proj-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-dim); background: var(--bg2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 9px; transition: color .12s, border-color .12s; }
  .proj-chip:hover { color: var(--text); border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .proj-chip.on { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--bg2)); }
  .proj-chip.new { color: var(--accent); border-style: dashed; border-color: color-mix(in oklab, var(--accent) 50%, var(--border)); }
  .connect-list { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; padding-right: 4px; margin-right: -4px; }
  .connect-list.scrollable { flex: 1 1 auto; }
  .connect-card {
    display: flex; align-items: center; gap: 12px; text-align: left;
    padding: 12px 14px; border-radius: 11px; background: var(--bg2);
    border: 1px solid transparent; transition: border-color .12s, background .12s;
    width: 100%;
  }
  .connect-card:hover { border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: var(--bg3); }
  .connect-card-wrap { position: relative; }
  .connect-card-actions {
    position: absolute; top: 50%; right: 12px; transform: translateY(-50%);
    display: flex; gap: 4px; opacity: 0; transition: opacity .12s; z-index: 3;
  }
  .connect-card-wrap:hover .connect-card-actions { opacity: 1; }
  .connect-card-wrap:hover .connect-arrow { display: none; }
  .cc-action {
    width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    background: var(--bg1); border: 1px solid var(--border); color: var(--text-dim); transition: color .12s, border-color .12s, background .12s;
  }
  .cc-action:hover { color: var(--text); border-color: var(--accent); background: var(--bg2); }
  .cc-action.danger:hover { color: #e06c75; border-color: #e06c75; background: #e06c7514; }
  .connect-empty { padding: 18px; text-align: center; font-size: 12.5px; color: var(--text-faint); }
  .connect-card:hover .connect-arrow { color: var(--accent) !important; transform: translateX(2px); }
  .connect-arrow { transition: transform .12s, color .12s; }
  .connect-card-info { flex: 1; min-width: 0; }
  .connect-card-name { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .connect-card-detail { font-family: var(--mono); font-size: 11px; color: var(--text-dim); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .connect-actions { display: flex; gap: 8px; align-items: center; }
  .connect-footnote { font-size: 11.5px; color: var(--text-faint); }

  /* ---------- modal ---------- */
  .modal-scrim {
    position: fixed; inset: 0; background: rgba(0,0,0,.5); backdrop-filter: blur(2px);
    display: flex; align-items: center; justify-content: center; z-index: 50;
    overflow-y: auto; padding: 16px;
  }
  .modal {
    width: 480px; max-width: calc(100vw - 48px); background: var(--bg1);
    max-height: calc(100vh - 32px); overflow-y: auto;
    border: 1px solid var(--border); border-radius: 14px; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 24px 60px rgba(0,0,0,.5);
  }
  .modal-title { display: flex; align-items: center; justify-content: space-between; font-size: 15px; font-weight: 600; }
  .engine-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  .name-grid { margin-bottom: 2px; }
  /* compact new-connection modal */
  .conn-modal { width: 440px; gap: 11px; padding: 18px; max-height: min(820px, calc(100vh - 90px)); overflow: hidden; }
  .conn-scroll { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 11px; margin: 0 -8px; padding: 0 8px; }
  .conn-modal .form-section-label { margin-bottom: -2px; }
  .imp-trigger { margin-left: auto; display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px solid var(--border); border-radius: 7px; padding: 3px 9px; cursor: pointer; font-family: var(--ui); font-size: 10.5px; color: var(--text-dim); }
  .imp-trigger:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); background: color-mix(in oklab, var(--accent) 8%, transparent); }
  .imp-trigger .m-icon { flex: none; }
  .modal-title .imp-trigger + .icon-btn { margin-left: 6px; }
  .imp-scrim { z-index: 60; background: color-mix(in oklab, var(--bg0) 55%, transparent); backdrop-filter: blur(2px); }
  .imp-sheet { width: 480px; gap: 12px; padding: 18px; max-height: min(680px, calc(100vh - 90px)); overflow: hidden; }
  .imp-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin: 0 -8px; padding: 0 8px; }
  .imp-field, .imp-map, .imp-support { flex: none; }
  .imp-lede { margin: -4px 0 0; font-size: 11.5px; line-height: 1.55; color: var(--text-dim); }
  .imp-field { border: 1px solid var(--border); border-radius: 10px; background: var(--bg0); overflow: hidden; transition: border-color .12s; }
  .imp-field:focus-within { border-color: var(--accent); }
  .imp-field.good { border-color: color-mix(in oklab, var(--accent) 55%, var(--border)); }
  .imp-field.bad { border-color: color-mix(in oklab, #e06c75 55%, var(--border)); }
  .imp-field textarea { display: block; width: 100%; resize: none; border: none; background: none; padding: 11px 12px 8px; font-family: var(--mono); font-size: 11.5px; line-height: 1.6; color: var(--text); }
  .imp-field textarea:focus { outline: none; }
  .imp-field textarea::placeholder { color: var(--text-faint); }
  .imp-field-foot { display: flex; align-items: center; gap: 8px; padding: 6px 12px 7px; border-top: 1px solid var(--border); background: var(--bg1); min-height: 28px; }
  .imp-detect { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text); min-width: 0; }
  .imp-detect code { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .imp-detect em { font-style: normal; font-size: 10px; color: var(--warn); }
  .imp-detect.idle { color: var(--text-faint); font-size: 10.5px; }
  .imp-detect.err { color: #e06c75; font-size: 10.5px; line-height: 1.45; align-items: flex-start; }
  .imp-detect.err .m-icon { flex: none; margin-top: 1px; }
  .imp-eng-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .imp-clear { margin-left: auto; background: none; border: none; padding: 0; cursor: pointer; font-family: var(--ui); font-size: 10.5px; color: var(--text-faint); flex: none; }
  .imp-clear:hover { color: var(--text); }
  .imp-map { border: 1px solid var(--border); border-radius: 10px; background: color-mix(in oklab, var(--accent) 5%, var(--bg1)); padding: 10px 12px 11px; display: flex; flex-direction: column; gap: 9px; }
  .imp-map-head { display: flex; align-items: center; gap: 6px; font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); }
  .imp-map-head .m-icon { color: var(--accent); }
  .imp-dl { display: grid; grid-template-columns: 96px 1fr; gap: 5px 12px; margin: 0; align-items: baseline; }
  .imp-dl dt { font-size: 10.5px; color: var(--text-faint); }
  .imp-dl dd { margin: 0; font-family: var(--mono); font-size: 11.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .imp-dl dd.secret { color: var(--accent); letter-spacing: .08em; }
  .imp-extra, .imp-support { display: flex; flex-direction: column; gap: 5px; }
  .imp-extra-lbl { font-size: 9.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--text-faint); }
  .imp-tags { display: flex; flex-wrap: wrap; gap: 4px; }
  .imp-tags code { font-family: var(--mono); font-size: 10px; color: var(--text-dim); background: var(--bg0); border: 1px solid var(--border); border-radius: 5px; padding: 2px 6px; }
  .imp-warn { display: flex; gap: 6px; align-items: flex-start; font-size: 10.5px; line-height: 1.5; color: var(--text-dim); }
  .imp-warn .m-icon { color: var(--warn); flex: none; margin-top: 1px; }
  .conn-modal .engine-choice { padding: 8px 4px; gap: 5px; font-size: 11px; border-radius: 8px; }
  .conn-modal .engine-picker { gap: 6px; }
  .conn-modal .env-picker { padding: 10px; gap: 7px; }
  .conn-modal .env-seg-btn { padding: 6px 4px; font-size: 11px; }
  .conn-modal .form-grid { gap: 9px 10px; }
  .conn-modal .form-grid input, .conn-modal .form-grid select, .conn-modal .form-select { padding: 6px 9px; font-size: 12px; }
  .conn-modal .proj-chips { margin-top: 5px; }
  .conn-modal .modal-tabs { margin-top: -2px; }
  /* engine vertical list + environment */
  .eng-env-stack { display: flex; flex-direction: column; gap: 12px; }
  .ee-block { display: flex; flex-direction: column; gap: 6px; }
  .engine-vlist { display: flex; flex-direction: column; gap: 5px; }
  .engine-vrow { display: flex; align-items: center; gap: 10px; padding: 7px 11px; border-radius: 8px; background: var(--bg2); border: 1px solid var(--border); color: var(--text-dim); transition: border-color .12s, color .12s; }
  .engine-vrow:hover { color: var(--text); }
  .engine-vrow.active { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--bg2)); color: var(--text); }
  .engine-vrow-name { font-size: 12.5px; font-weight: 500; }
  .env-colors { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .env-colors-label { font-size: 11px; color: var(--text-faint); margin-right: 2px; }
  .engine-choice {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 12px 6px; border-radius: 10px; background: var(--bg2);
    border: 1px solid transparent; color: var(--text-dim); font-size: 11.5px;
    transition: border-color .12s;
  }
  .engine-choice.active { border-color: var(--accent); color: var(--text); background: color-mix(in oklab, var(--accent) 7%, var(--bg2)); }

  /* environment picker */
  .env-picker { display: flex; flex-direction: column; gap: 9px; padding: 13px; border-radius: 11px; background: color-mix(in oklab, var(--bg2) 55%, var(--bg1)); border: 1px solid var(--border); }
  .env-picker-head { display: flex; align-items: center; justify-content: space-between; }
  .form-section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--text-faint); }
  .env-seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 7px; }
  .env-seg-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 8px 6px; border-radius: 9px; font-size: 12px; font-weight: 500;
    color: var(--text-dim); background: var(--bg1); border: 1px solid var(--border);
    transition: border-color .12s, background .12s, color .12s;
  }
  .env-seg-btn:hover { color: var(--text); }
  .env-seg-btn .env-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .env-colors { display: flex; align-items: center; gap: 7px; }
  .env-colors-label { font-size: 11px; color: var(--text-faint); margin-right: 2px; }
  .env-swatch { width: 20px; height: 20px; border-radius: 7px; border: 2px solid transparent; transition: transform .1s; }
  .env-swatch:hover { transform: scale(1.12); }
  .env-swatch.active { border-color: var(--text); }
  .env-warn {
    display: flex; align-items: center; gap: 8px; font-size: 11.5px; color: #e06c75;
    background: #e06c7510; border: 1px solid #e06c7530; border-radius: 8px; padding: 8px 11px;
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid label { display: flex; flex-direction: column; gap: 5px; font-size: 11.5px; color: var(--text-dim); font-weight: 500; }
  .form-grid label.span-2, .form-grid > .span-2 { grid-column: span 2; }
  /* let selects/inputs shrink inside grid tracks — prevents long <option> text widening the column and forcing horizontal scroll */
  .form-grid > *, .form-grid label { min-width: 0; }
  .form-grid select, .form-grid .form-select, .form-grid input { max-width: 100%; min-width: 0; }
  .form-grid input {
    background: var(--bg0); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 12.5px; font-family: var(--mono); outline: none;
    transition: border-color .12s; width: 100%;
  }
  .form-grid input:focus { border-color: var(--accent); }
  .file-row { display: flex; gap: 8px; align-items: center; }
  .modal-actions { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
  .test-result { flex: 1; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); }

  /* ---------- workspace layout ---------- */
  .workspace {
    flex: 1; min-height: 0; min-width: 0; display: grid;
    grid-template-columns: 248px 1fr;
    grid-template-rows: 1fr 28px;
    grid-template-areas: "sidebar main" "status status";
  }
  .main-col { grid-area: main; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tab-content { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg0); }

  /* ============ visual query builder (embedded tab) ============ */
  .vqb-tab { display: flex; flex-direction: column; height: 100%; min-height: 0; flex: 1; }
  .vqb-toolbar { display: flex; align-items: center; gap: 16px; height: 42px; padding: 0 14px; background: var(--bg1); border-bottom: 1px solid var(--border); flex: none; }
  .vqb-tb-meta { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 12px; }
  .vqb-tb-meta .msym { color: var(--accent); }
  .vqb-tb-actions { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .vqb-rail-toggle { display: flex; align-items: center; justify-content: center; width: 30px; height: 28px; border-radius: 7px; border: 1px solid var(--border); color: var(--text-faint); flex: none; }
  .vqb-rail-toggle:hover { color: var(--text); background: var(--bg2); }
  .vqb-rail-toggle.on { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }
  .vqb-panel-toggles { display: flex; gap: 0; margin-left: 4px; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .vqb-panel-toggles .vqb-rail-toggle { border: none; border-right: 1px solid var(--border); border-radius: 0; width: 32px; }
  .vqb-panel-toggles .vqb-rail-toggle:last-child { border-right: none; }
  .vqb-panel-toggles .vqb-rail-toggle.on { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .vqb-rail-stub { width: 34px; flex: none; background: var(--bg1); display: flex; align-items: flex-start; justify-content: center; padding-top: 12px; color: var(--text-faint); }
  .vqb-rail-stub.left { border-right: 1px solid var(--border); }
  .vqb-rail-stub.right { border-left: 1px solid var(--border); }
  .vqb-rail-stub:hover { color: var(--accent); background: var(--bg2); }
  .vqb-tbtn { display: flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); color: var(--text-dim); font-size: 12px; }
  .vqb-tbtn:hover { color: var(--text); border-color: var(--text-faint); background: var(--bg2); }
  .vqb-main { display: flex; flex: 1; min-height: 0; }

  .vqb-sidebar { width: 198px; flex: none; background: var(--bg1); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
  .vqb-side-head { display: flex; align-items: center; gap: 8px; padding: 13px 14px 9px; }
  .vqb-side-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
  .vqb-side-count { margin-left: auto; font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  .vqb-search { display: flex; align-items: center; gap: 7px; margin: 0 12px 10px; padding: 6px 9px; background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; color: var(--text-faint); }
  .vqb-search input { background: none; border: none; outline: none; flex: 1; font-size: 12.5px; color: var(--text); }
  .vqb-side-list { flex: 1; overflow-y: auto; padding: 0 8px; display: flex; flex-direction: column; gap: 3px; }
  .vqb-tchip { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 9px; border-radius: 8px; color: var(--text-dim); text-align: left; transition: background .12s; }
  .vqb-tchip:hover:not(:disabled) { background: var(--bg2); color: var(--text); }
  .vqb-tchip:hover:not(:disabled) .msym { color: var(--accent); }
  .vqb-tchip-name { font-size: 13px; font-family: var(--mono); }
  .vqb-tchip-meta { margin-left: auto; font-size: 10.5px; color: var(--text-faint); }
  .vqb-tchip.used { opacity: .45; cursor: default; }
  .vqb-tchip .msym { color: var(--text-faint); }
  .vqb-side-foot { display: flex; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--border); color: var(--text-faint); font-size: 11px; line-height: 1.5; }
  .vqb-side-foot .msym { color: var(--accent); flex: none; margin-top: 1px; }

  .vqb-canvas-wrap { flex: 1; position: relative; overflow: hidden; cursor: grab; background: var(--bg0); min-width: 0; }
  .vqb-canvas-wrap:active { cursor: grabbing; }
  .vqb-grid-bg { position: absolute; inset: 0; background-image: radial-gradient(var(--bg3) 1px, transparent 1px); background-size: 22px 22px; opacity: .5; pointer-events: none; }
  .vqb-world { position: absolute; inset: 0; transform-origin: 0 0; }
  .vqb-canvas-empty { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; max-width: 380px; color: var(--text-faint); pointer-events: none; }
  .vqb-canvas-empty .msym { color: var(--bg3); margin-bottom: 6px; }
  .vqb-canvas-empty h2 { font-size: 17px; color: var(--text-dim); font-weight: 600; margin-bottom: 7px; }
  .vqb-canvas-empty p { font-size: 12.5px; line-height: 1.6; }

  .vqb-node { position: absolute; background: var(--bg1); border: 1px solid var(--border); border-radius: 11px; box-shadow: 0 8px 28px rgba(0,0,0,.36); overflow: visible; user-select: none; }
  .vqb-node-head { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px 0 12px; background: linear-gradient(var(--bg2), var(--bg1)); border-bottom: 1px solid var(--border); border-radius: 11px 11px 0 0; cursor: grab; }
  .vqb-node-head:active { cursor: grabbing; }
  .vqb-node-head .msym { color: var(--accent); }
  .vqb-node-name { font-family: var(--mono); font-size: 13px; font-weight: 600; flex: 1; }
  .vqb-node-all { font-family: var(--mono); font-size: 10px; color: var(--text-faint); border: 1px solid var(--border); border-radius: 5px; padding: 2px 5px; }
  .vqb-node-all:hover { color: var(--accent); border-color: var(--accent); }
  .vqb-node-x { color: var(--text-faint); display: flex; padding: 3px; border-radius: 5px; }
  .vqb-node-x:hover { color: var(--danger); background: var(--bg3); }
  .vqb-node-cols { padding: 6px 0; }
  .vqb-col { display: flex; align-items: center; gap: 6px; padding: 0 12px; position: relative; cursor: default; }
  .vqb-col:hover { background: var(--bg2); }
  .vqb-col.on .vqb-col-name { color: var(--text); }
  .vqb-col-name { font-family: var(--mono); font-size: 12px; color: var(--text-dim); cursor: pointer; flex-shrink: 0; }
  .vqb-col .msym { color: var(--text-faint); }
  .vqb-col-type { margin-left: auto; font-family: var(--mono); font-size: 10px; }
  .vqb-col-check { display: flex; padding: 0; }
  .vqb-check { width: 14px; height: 14px; border-radius: 4px; border: 1.5px solid var(--text-faint); display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
  .vqb-check.on { background: var(--accent); border-color: var(--accent); }
  .vqb-col-agg { font-family: var(--mono); font-size: 9.5px; background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; color: var(--accent); padding: 1px 3px; margin-left: 4px; cursor: pointer; }
  .vqb-port { position: absolute; width: 11px; height: 11px; border-radius: 50%; background: var(--bg3); border: 2px solid var(--text-faint); top: 50%; transform: translateY(-50%); cursor: crosshair; opacity: 0; transition: opacity .12s, background .12s; z-index: 2; }
  .vqb-port.left { left: -6px; }
  .vqb-port.right { right: -6px; }
  .vqb-col:hover .vqb-port, .vqb-node:hover .vqb-port { opacity: 1; }
  .vqb-port:hover { background: var(--accent); border-color: var(--accent); transform: translateY(-50%) scale(1.25); }

  .vqb-joins { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .vqb-join-path { fill: none; stroke: var(--accent); stroke-width: 2; opacity: .7; }
  .vqb-join-path.left { stroke-dasharray: 6 4; }
  .vqb-join-path.right { stroke-dasharray: 6 4; stroke: #5aa9f5; }
  .vqb-join-path.cross { stroke-dasharray: 2 5; stroke: #c87ff0; opacity: .8; }
  .vqb-join-path.pending { opacity: .9; stroke-dasharray: 4 4; }
  .vqb-join-hit { fill: none; stroke: transparent; stroke-width: 16; pointer-events: stroke; cursor: pointer; }
  .vqb-join:hover .vqb-join-path { opacity: 1; stroke-width: 2.5; }
  .vqb-join-pill { display: flex; align-items: center; justify-content: center; gap: 0; height: 100%; pointer-events: all; }
  .vqb-join-type { font-family: var(--mono); font-size: 9px; font-weight: 600; letter-spacing: .04em; padding: 3px 6px; border-radius: 6px 0 0 6px; background: var(--bg2); border: 1px solid var(--border); color: var(--accent); }
  .vqb-join-type.left { color: #f5b54a; }
  .vqb-join-type.right { color: #5aa9f5; }
  .vqb-join-type.cross { color: #c87ff0; }
  .vqb-join-type:hover { background: var(--bg3); }
  .vqb-join-del { display: flex; padding: 3px 4px; border-radius: 0 6px 6px 0; background: var(--bg2); border: 1px solid var(--border); border-left: none; color: var(--text-faint); }
  .vqb-join-del:hover { color: var(--danger); background: var(--bg3); }

  .vqb-inspector { width: 264px; flex: none; background: var(--bg1); border-left: 1px solid var(--border); overflow-y: auto; }
  .vqb-insp-sec { padding: 14px; border-bottom: 1px solid var(--border); }
  .vqb-insp-h { display: flex; align-items: center; gap: 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); margin-bottom: 11px; }
  .vqb-insp-h .msym { color: var(--text-dim); }
  .vqb-insp-h span { color: var(--text-dim); }
  .vqb-insp-add { margin-left: auto; display: flex; align-items: center; gap: 3px; font-size: 11px; text-transform: none; letter-spacing: 0; color: var(--accent); padding: 3px 7px; border-radius: 6px; border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
  .vqb-insp-add:hover:not(:disabled) { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .vqb-insp-add:disabled { color: var(--text-faint); border-color: var(--border); cursor: default; }
  .vqb-insp-empty { font-size: 12px; color: var(--text-faint); line-height: 1.5; }
  .vqb-where-list { display: flex; flex-direction: column; gap: 7px; }
  .vqb-where { display: flex; align-items: center; gap: 5px; }
  .vqb-where.off { opacity: .45; }
  .vqb-where-tog { width: 16px; height: 16px; flex: none; border-radius: 4px; border: 1.5px solid var(--text-faint); display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
  .vqb-where-tog.on { background: var(--accent); border-color: var(--accent); }
  .vqb-sel { background: var(--bg0); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; padding: 5px 6px; cursor: pointer; min-width: 0; }
  .vqb-sel:focus { outline: none; border-color: var(--accent); }
  .vqb-where .vqb-sel:first-of-type { flex: 1; font-family: var(--mono); }
  .vqb-sel.op { width: 64px; flex: none; }
  .vqb-where-val { width: 56px; flex: none; background: var(--bg0); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 11px; padding: 5px 6px; font-family: var(--mono); outline: none; }
  .vqb-where-val:focus { border-color: var(--accent); }
  .vqb-where-x { color: var(--text-faint); display: flex; padding: 2px; }
  .vqb-where-x:hover { color: var(--danger); }
  .vqb-sort-row { display: flex; gap: 8px; }
  .vqb-sort-row .vqb-sel { flex: 1; }
  .vqb-seg { display: flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; flex: none; }
  .vqb-seg.wide { width: 100%; }
  .vqb-seg button { flex: 1; font-size: 11px; font-family: var(--mono); padding: 5px 9px; color: var(--text-dim); border-right: 1px solid var(--border); }
  .vqb-seg button:last-child { border-right: none; }
  .vqb-seg button.on { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .vqb-seg button:disabled { opacity: .4; cursor: default; }

  .vqb-dock { flex: none; background: var(--bg1); border-top: 1px solid var(--border); display: flex; flex-direction: column; height: 264px; }
  .vqb-dock.collapsed { height: 42px; }
  .vqb-dock-bar { display: flex; align-items: center; gap: 6px; height: 42px; padding: 0 10px; flex: none; }
  .vqb-dock-tab-toggle { display: flex; padding: 5px; border-radius: 6px; color: var(--text-faint); }
  .vqb-dock-tab-toggle:hover { color: var(--text); background: var(--bg2); }
  .vqb-dock-tabs { display: flex; gap: 2px; }
  .vqb-dock-tabs button { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text-dim); padding: 6px 12px; border-radius: 7px; }
  .vqb-dock-tabs button:hover { color: var(--text); }
  .vqb-dock-tabs button.on { color: var(--text); background: var(--bg2); }
  .vqb-dock-tabs button.on .msym { color: var(--accent); }
  .vqb-dock-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .vqb-dock-meta { font-size: 11px; color: var(--text-faint); font-family: var(--mono); }
  .vqb-dock-copy { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); padding: 6px 11px; border-radius: 8px; border: 1px solid var(--border); }
  .vqb-dock-copy:hover { color: var(--text); border-color: var(--text-faint); background: var(--bg2); }
  .vqb-run { display: flex; align-items: center; gap: 5px; font-size: 12.5px; font-weight: 600; color: var(--on-accent); background: var(--accent); padding: 6px 14px; border-radius: 8px; }
  .vqb-run:hover { filter: brightness(1.08); }
  .vqb-dock-body { flex: 1; min-height: 0; overflow: auto; border-top: 1px solid var(--border); }
  .vqb-sql { font-family: var(--mono); font-size: 12.5px; line-height: 1.65; padding: 14px 16px; white-space: pre; color: var(--text); }
  .vqb-results-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-faint); font-size: 12.5px; }
  .vqb-results-empty .msym { color: var(--bg3); }
  .vqb-grid-wrap { overflow: auto; height: 100%; }
  .vqb-grid { border-collapse: collapse; font-family: var(--mono); font-size: 12px; width: 100%; }
  .vqb-grid th { position: sticky; top: 0; background: var(--bg2); color: var(--text-dim); font-weight: 500; text-align: left; padding: 7px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; z-index: 1; }
  .vqb-grid td { padding: 6px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); color: var(--text); white-space: nowrap; }
  .vqb-grid td.num { text-align: left; color: #5aa7f5; }
  .vqb-grid td.null { color: var(--text-faint); font-style: italic; }
  .vqb-grid tbody tr:hover td { background: var(--bg2); }
  .vqb-toast { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--bg3); border: 1px solid var(--border); color: var(--text); font-size: 12.5px; padding: 8px 15px; border-radius: 9px; box-shadow: 0 8px 24px rgba(0,0,0,.4); animation: vqb-toast-in .2s ease; z-index: 5; }
  @keyframes vqb-toast-in { from { opacity: 0; transform: translate(-50%, 8px); } to { opacity: 1; transform: translate(-50%, 0); } }

  /* ---------- sidebar ---------- */
  .sidebar {
    grid-area: sidebar; background: var(--bg1); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-conn { display: flex; align-items: center; gap: 10px; padding: 12px 12px 10px; }
  .sidebar-conn-info { flex: 1; min-width: 0; }
  .sidebar-conn-name { font-weight: 600; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .sidebar-conn-detail { font-family: var(--mono); font-size: 10px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .conn-env { font-weight: 600; text-transform: uppercase; letter-spacing: .05em; font-size: 9px; }
  .conn-eng { color: var(--text-faint); }
  .sidebar-search {
    margin: 0 10px 8px; display: flex; align-items: center; gap: 7px;
    background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 0 6px 0 9px;
    transition: border-color .12s;
  }
  .sidebar-search:focus-within { border-color: var(--accent); }
  .sidebar-search input { flex: 1; background: none; border: none; outline: none; font-size: 12px; padding: 7px 0; min-width: 0; }
  .sidebar-section-label {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 14px 4px; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .1em; color: var(--text-faint);
  }
  .sidebar-count { font-family: var(--mono); }
  .sidebar-tables { flex: 1; overflow-y: auto; padding: 0 6px 8px; }
  .table-item {
    display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
    cursor: pointer; transition: background .1s; user-select: none;
  }
  .table-item:hover { background: var(--bg2); }
  .table-item.active { background: color-mix(in oklab, var(--accent) 12%, var(--bg2)); }
  .table-item.active .table-item-name { color: var(--text); font-weight: 500; }
  .table-item-name { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .table-item-count { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .sidebar-nomatch { padding: 12px; font-size: 12px; color: var(--text-faint); }
  .sidebar-footer { padding: 10px; border-top: 1px solid var(--border); }

  .ctx-menu {
    position: fixed; z-index: 60; background: var(--bg2); border: 1px solid var(--border);
    border-radius: 10px; padding: 5px; min-width: 190px;
    box-shadow: 0 12px 32px rgba(0,0,0,.45);
  }
  .ctx-item {
    display: flex; align-items: center; gap: 9px; padding: 7px 10px; border-radius: 6px;
    font-size: 12.5px; cursor: pointer; color: var(--text-dim);
  }
  .ctx-item:hover { background: var(--bg3); color: var(--text); }
  .ctx-item.danger { color: #e06c75; }
  .ctx-item.danger:hover { background: #e06c7518; color: #e06c75; }
  .ctx-item.ctx-item-accent { color: var(--accent); }
  .ctx-item.ctx-item-accent:hover { background: color-mix(in oklab, var(--accent) 14%, var(--bg3)); color: var(--accent); }
  .ctx-menu-label { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); padding: 6px 10px 3px; }
  .table-actions-menu { position: absolute; right: 0; left: auto; top: calc(100% + 4px); min-width: 230px; z-index: 60; }
  .ctx-sep { height: 1px; background: var(--border); margin: 4px 6px; }
  .btn-danger { background: #e06c75; color: #fff; }
  .btn-danger:hover { filter: brightness(1.08); }
  .btn-danger.disabled, .btn-danger:disabled { opacity: .45; cursor: default; filter: none; }
  /* truncate modal */
  .truncate-modal { width: 460px; }
  .truncate-body { font-size: 13px; color: var(--text-dim); line-height: 1.55; display: flex; flex-direction: column; gap: 12px; }
  .truncate-body b { color: var(--text); }
  .truncate-body code { font-family: var(--mono); color: var(--text); }
  .truncate-sql { font-family: var(--mono); font-size: 12px; color: #e06c75; background: #e06c750f; border: 1px solid #e06c7530; border-radius: 8px; padding: 9px 12px; margin: 0; }
  .truncate-prod { display: flex; flex-direction: column; gap: 8px; }
  .truncate-prod-tag { display: inline-flex; align-items: center; gap: 5px; align-self: flex-start; font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 2px 8px; border-radius: 99px; border: 1px solid; }
  .truncate-prod label { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--text-dim); }
  .truncate-prod label b { color: var(--text); font-family: var(--mono); }
  .truncate-prod input { background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-family: var(--mono); font-size: 12.5px; outline: none; color: var(--text); }
  .truncate-prod input:focus { border-color: #e06c75; }
  /* export / import progress modal */
  .export-modal { width: 440px; }
  .export-file { display: flex; align-items: center; gap: 9px; background: var(--bg0); border: 1px solid var(--border); border-radius: 9px; padding: 9px 12px; font-family: var(--mono); font-size: 12px; }
  .export-file-name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .export-cur { color: var(--accent); font-size: 11px; }
  .export-bar { height: 8px; border-radius: 4px; background: var(--bg3); overflow: hidden; }
  .export-bar-fill { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .15s ease-out; }
  .export-meta { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .export-choose { display: flex; flex-direction: column; gap: 6px; }
  .export-opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 9px; background: var(--bg1); border: 1px solid var(--border); text-align: left; transition: border-color .12s, background .12s; }
  .export-opt:hover { border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); }
  .export-opt.on { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 8%, var(--bg1)); }
  .export-opt-radio { display: inline-flex; color: var(--accent); flex: none; }
  .export-opt.on .export-opt-radio { color: var(--accent); }
  .export-opt:not(.on) .export-opt-radio { color: var(--text-faint); }
  .export-opt-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .export-opt-text b { font-size: 12.5px; font-weight: 600; }
  .export-opt-text span { font-size: 11px; color: var(--text-faint); }
  /* import modal */
  .import-modal { width: 620px; }
  .import-format { display: flex; align-items: center; gap: 8px; }
  .import-textarea {
    width: 100%; height: 130px; resize: vertical; background: var(--bg0); border: 1px solid var(--border);
    border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 11.5px; line-height: 1.5;
    outline: none; color: var(--text);
  }
  .import-textarea:focus { border-color: var(--accent); }
  .import-err { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11.5px; color: #e06c75; background: #e06c750f; border: 1px solid #e06c7530; border-radius: 8px; padding: 9px 12px; }
  .import-preview { display: flex; flex-direction: column; gap: 8px; }
  .import-preview-bar { display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; flex-wrap: wrap; }
  .import-ready { display: inline-flex; align-items: center; gap: 6px; color: var(--text); }
  .import-match { color: var(--text-dim); }
  .import-unknown { color: #e2b340; }
  .import-preview-grid { max-height: 180px; overflow: auto; border: 1px solid var(--border); border-radius: 8px; }
  .import-note { flex: 1; font-size: 10.5px; color: var(--text-faint); line-height: 1.45; }
  .import-busy { display: flex; flex-direction: column; gap: 6px; }
  /* DynamoDB export/import extras */
  .ddb-io-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); margin: 2px 0 -2px; }
  .ddb-io-seg { align-self: stretch; }
  .ddb-io-seg .seg-btn:disabled { opacity: .4; cursor: not-allowed; }
  .ddb-io-hint { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); }
  .import-note code { font-family: var(--mono); color: var(--text-dim); }

  /* ============ MongoDB ============ */
  .mg-mono, .mg-mono input, input.mg-mono, textarea.mg-mono { font-family: var(--mono); font-size: 11.5px; }
  /* value chips */
  .mg-oid { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11px; color: #b08cff; }
  .mg-date { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11px; color: #e2b340; }
  .mg-arr { font-family: var(--mono); font-size: 11px; color: #56b6c2; }
  .mg-obj { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 11px; color: #61afef; }
  .cell-absent { color: var(--text-faint); }
  /* sidebar index lines */
  .mg-idx-line { display: flex; align-items: center; gap: 6px; padding: 2px 8px 2px 30px; font-size: 11px; color: var(--text-dim); font-family: var(--mono); }
  .mg-idx-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mg-idx-flag { font-size: 9px; padding: 0 4px; border-radius: 3px; background: var(--bg3); color: var(--text-faint); font-family: var(--ui); letter-spacing: .03em; }
  .sec-more-btn { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 18px; border: none; background: none; color: var(--text-faint); border-radius: 4px; cursor: pointer; }
  .sec-more-btn:hover { background: var(--bg3); color: var(--text); }
  .schema-pop-count { margin-left: auto; font-size: 10px; color: var(--text-faint); font-family: var(--mono); }

  /* find bar */
  .mg-find-bar { display: flex; align-items: flex-end; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg1); flex-wrap: wrap; }
  .mg-find-field { display: flex; flex-direction: column; gap: 3px; }
  .mg-find-filter { flex: 1; min-width: 220px; }
  .mg-find-limit { width: 96px; }
  .mg-find-label { font-size: 10px; color: var(--text-faint); display: inline-flex; align-items: center; gap: 3px; text-transform: uppercase; letter-spacing: .04em; }
  .mg-find-field .where-input { width: 100%; }
  .mg-find-field .filter-select { width: 100%; max-width: none; }
  .mg-view-seg .seg-btn { padding: 4px 9px; }

  /* tree view */
  .mg-tree-wrap { flex: 1; overflow: auto; padding: 8px 10px; display: flex; flex-direction: column; gap: 8px; }
  .mg-tree-doc { border: 1px solid var(--border); border-radius: 8px; background: var(--bg1); overflow: hidden; flex: none; }
  .mg-tree-doc-head { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .mg-tree-idx { font-size: 10px; color: var(--text-faint); font-family: var(--mono); min-width: 18px; }
  .mg-tree-doc-fields { font-size: 10.5px; color: var(--text-faint); }
  .mg-tree-edit { margin-left: auto; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 22px; border: 1px solid transparent; background: none; color: var(--text-faint); border-radius: 5px; cursor: pointer; }
  .mg-tree-edit:hover { background: var(--bg3); color: var(--accent); border-color: var(--border); }
  .mg-tree-del { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 22px; border: 1px solid transparent; background: none; color: var(--text-faint); border-radius: 5px; cursor: pointer; }
  .mg-tree-del:hover { background: color-mix(in oklab, var(--danger) 14%, transparent); color: var(--danger); border-color: color-mix(in oklab, var(--danger) 45%, var(--border)); }
  .mg-tree-del.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
  .mg-tree-doc-body { padding: 5px 8px 7px; }
  .mg-tree-row { display: flex; align-items: center; gap: 7px; height: 21px; font-family: var(--mono); font-size: 11.5px; }
  .mg-tree-parent { cursor: pointer; border-radius: 4px; }
  .mg-tree-parent:hover { background: var(--bg2); }
  .mg-tree-caret { color: var(--text-faint); transition: transform .12s; flex-shrink: 0; }
  .mg-tree-caret.open { transform: rotate(90deg); }
  .mg-tree-key { color: #61afef; }
  .mg-tree-colon { color: var(--text-faint); margin: 0 1px; }
  .mg-tree-preview { color: var(--text-faint); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mg-tree-type { margin-left: auto; font-size: 9.5px; font-family: var(--ui); opacity: .7; padding-left: 8px; }

  /* document JSON editor modal */
  .mg-doc-modal { width: 600px; max-width: 94vw; }
  .mg-doc-editor { width: 100%; min-height: 320px; max-height: 50vh; resize: vertical; background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; color: var(--text); font-family: var(--mono); font-size: 12px; line-height: 1.55; spellcheck: false; }
  .mg-doc-editor:focus { outline: none; border-color: var(--accent); }
  .mg-doc-status { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 11px; }
  .mg-doc-err { display: inline-flex; align-items: center; gap: 5px; color: #e06c75; font-family: var(--mono); }
  .mg-doc-ok { display: inline-flex; align-items: center; gap: 5px; color: var(--accent); }
  .mg-doc-hint { margin-left: auto; color: var(--text-faint); font-family: var(--mono); font-size: 10px; }
  .mg-validated { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; color: var(--accent); padding: 1px 6px; border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); border-radius: 10px; }
  .mg-del-btn { color: #e06c75 !important; }

  /* structure */
  .mg-structure { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .mg-struct-tabs { display: flex; gap: 4px; padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--bg1); }
  .mg-struct-tab { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1px solid transparent; border-radius: 7px; background: none; color: var(--text-dim); font-size: 12px; cursor: pointer; }
  .mg-struct-tab:hover { background: var(--bg2); color: var(--text); }
  .mg-struct-tab.active { background: color-mix(in oklab, var(--accent) 12%, var(--bg2)); color: var(--text); border-color: color-mix(in oklab, var(--accent) 35%, transparent); }
  .mg-dot-on { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 2px; }
  .mg-struct-body { flex: 1; overflow: auto; padding: 14px 16px; }
  .mg-schema-table td { vertical-align: middle; }
  .mg-field-dot { color: var(--text-faint); margin-right: 4px; }
  .mg-arr-tag { color: #56b6c2; font-family: var(--mono); font-size: 10px; margin-left: 3px; }
  .mg-type-chip { display: inline-block; font-family: var(--mono); font-size: 10px; padding: 1px 6px; border: 1px solid; border-radius: 9px; margin-right: 4px; }
  .mg-presence { display: inline-flex; align-items: center; gap: 8px; }
  .mg-presence-bar { width: 90px; height: 6px; border-radius: 3px; background: var(--bg3); overflow: hidden; }
  .mg-presence-fill { display: block; height: 100%; border-radius: 3px; }
  .mg-presence-num { font-size: 10.5px; color: var(--text-dim); font-family: var(--mono); min-width: 32px; }
  .mg-indexes { display: flex; flex-direction: column; gap: 8px; max-width: 640px; }
  .mg-idx-keys-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .mg-idx-key { display: inline-flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); }
  .mg-idx-field { color: var(--text); }
  .mg-add-index { margin-top: 4px; }
  .mg-validation { max-width: 640px; }
  .mg-val-head { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text); margin-bottom: 10px; }
  .mg-val-level { font-size: 10px; color: var(--text-faint); font-family: var(--mono); padding: 1px 7px; border: 1px solid var(--border); border-radius: 9px; }
  .mg-no-validation { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px; color: var(--text-dim); text-align: center; }

  /* aggregation pipeline */
  .mg-pipeline { border-bottom: 1px solid var(--border); background: var(--bg1); max-height: 320px; display: flex; flex-direction: column; }
  .mg-pipeline-rail { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; align-items: stretch; }
  .mg-stage { min-width: 220px; max-width: 280px; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: 8px; background: var(--bg2); overflow: hidden; flex-shrink: 0; }
  .mg-stage-head { display: flex; align-items: center; gap: 6px; padding: 5px 7px; background: var(--bg3); }
  .mg-stage-num { width: 17px; height: 17px; border-radius: 50%; background: var(--bg1); color: var(--text-faint); font-size: 10px; display: inline-flex; align-items: center; justify-content: center; font-family: var(--mono); }
  .mg-stage-op { background: var(--bg0); color: var(--accent); border: 1px solid var(--border); border-radius: 5px; font-family: var(--mono); font-size: 11.5px; padding: 2px 4px; }
  .mg-stage-btn { width: 20px; height: 18px; display: inline-flex; align-items: center; justify-content: center; border: none; background: none; color: var(--text-faint); border-radius: 4px; cursor: pointer; }
  .mg-stage-btn:hover:not(:disabled) { background: var(--bg1); color: var(--text); }
  .mg-stage-btn:disabled { opacity: .3; cursor: default; }
  .mg-stage-del:hover { color: #e06c75 !important; }
  .mg-stage-body { border: none; background: var(--bg0); color: var(--text); font-family: var(--mono); font-size: 11px; padding: 8px; resize: vertical; min-height: 44px; line-height: 1.5; }
  .mg-stage-body:focus { outline: none; }
  .mg-add-stage { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 86px; border: 1px dashed var(--border); border-radius: 8px; background: none; color: var(--text-dim); cursor: pointer; flex-shrink: 0; }
  .mg-add-stage:hover { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 6%, transparent); }
  .mg-pipeline-run { display: flex; align-items: center; gap: 10px; padding: 0 12px 10px; }
  .mg-pipe-title { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--text); }
  .mg-pipe-coll { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12px; color: var(--text-faint); }
  .mg-pipe-coll select { background: var(--bg0); color: var(--accent); border: 1px solid var(--border); border-radius: 6px; font-family: var(--mono); font-size: 12px; padding: 3px 6px; }
  .mg-pipe-coll select:focus { outline: none; border-color: var(--accent); }
  .mg-pipe-empty { flex-direction: column; gap: 10px; }

  /* ===================== Cassandra ===================== */
  .btn-danger-text { display: inline-flex; align-items: center; gap: 5px; background: none; border: none; color: var(--danger); font-size: 12px; cursor: pointer; padding: 6px 8px; border-radius: 6px; }
  .btn-danger-text:hover { background: color-mix(in oklab, var(--danger) 14%, transparent); }
  /* value rendering */
  .cass-null { color: var(--text-faint); font-style: italic; }
  .cass-uuid { font-family: var(--mono); }
  .cass-coll { color: #61afef; }
  .cass-coll-item, .cass-map-v { color: #98c379; }
  .cass-map-k { color: #61afef; }
  /* key badges */
  .cass-kbadge { font-size: 8.5px; font-weight: 700; letter-spacing: .04em; padding: 1px 4px; border-radius: 3px; text-transform: uppercase; flex: none; }
  .cass-kbadge.pk { background: color-mix(in oklab, var(--accent) 20%, var(--bg2)); color: var(--accent); }
  .cass-kbadge.ck { background: color-mix(in oklab, #e5a458 22%, var(--bg2)); color: #e5a458; }
  .cass-kbadge.st { background: color-mix(in oklab, #b08cff 22%, var(--bg2)); color: #b08cff; }
  .cass-kbadge.sm { font-size: 7.5px; padding: 0 3px; }
  .cass-kind-reg { color: var(--text-faint); font-size: 11px; }
  /* sidebar pk line */
  .cass-pk-line { display: flex; align-items: center; gap: 6px; padding: 3px 8px 3px 26px; font-size: 10.5px; }
  .cass-pk-text { font-family: var(--mono); color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* row grid */
  .cass-grid-wrap { flex: 1; overflow: auto; }
  .cass-grid { border-collapse: collapse; font-size: 12px; min-width: 100%; }
  .cass-grid th, .cass-grid td { border-bottom: 1px solid var(--border); border-right: 1px solid color-mix(in oklab, var(--border) 55%, transparent); padding: 5px 12px; text-align: left; white-space: nowrap; }
  .cass-grid thead th { position: sticky; top: 0; background: var(--bg2); z-index: 1; font-weight: 600; }
  .cass-th-name { font-family: var(--mono); color: var(--text); margin-right: 6px; }
  .cass-th-type { color: var(--text-faint); font-size: 10px; margin-left: 6px; font-family: var(--mono); }
  .cass-grid-idx { width: 36px; color: var(--text-faint); font-family: var(--mono); font-size: 10px; text-align: right; }
  .cass-grid td.cass-cell { font-family: var(--mono); color: var(--text-dim); }
  .cass-grid th.cass-col-partition_key, .cass-grid td.cass-col-partition_key { background: color-mix(in oklab, var(--accent) 7%, transparent); }
  .cass-grid th.cass-col-clustering, .cass-grid td.cass-col-clustering { background: color-mix(in oklab, #e5a458 7%, transparent); }
  .cass-row { cursor: default; }
  .cass-row:hover td { background: var(--bg2); }
  .cass-grid-open { cursor: pointer; }
  .cass-grid-open:hover { color: var(--accent); }
  .cass-grid td.cass-cell-locked { cursor: not-allowed; }
  .cass-grid td.cass-cell-edited { background: color-mix(in oklab, var(--accent) 15%, transparent) !important; box-shadow: inset 2px 0 0 var(--accent); }
  .cass-grid td.cass-cell-editing { outline: 1.5px solid var(--accent); outline-offset: -1.5px; background: var(--bg0) !important; padding: 0 !important; }
  .cass-cell-input { width: 100%; box-sizing: border-box; background: var(--bg0); border: none; outline: none; font-family: var(--mono); font-size: 12px; color: var(--text); padding: 5px 12px; }
  .cass-cell-expand { opacity: 0; margin-left: 6px; color: var(--text-faint); border-radius: 4px; padding: 1px; vertical-align: middle; transition: opacity .1s; }
  .cass-cell:hover .cass-cell-expand { opacity: 1; }
  .cass-cell-expand:hover { color: var(--accent); background: var(--bg3); }
  /* query builder — unified SQL-style rows */
  .cass-builder { border-bottom: 1px solid var(--border); background: var(--bg1); display: flex; flex-direction: column; max-height: 360px; overflow-y: auto; padding: 14px 16px; gap: 10px; }
  .cass-qb-rows { gap: 7px; }
  .cass-key-row .cass-key-badge { font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .04em; padding: 2px 5px; border-radius: 5px; flex: none; }
  .cass-key-badge.pk { color: var(--accent); background: color-mix(in oklab, var(--accent) 16%, transparent); }
  .cass-key-badge.ck { color: #e5a458; background: color-mix(in oklab, #e5a458 16%, transparent); }
  .cass-key-col { display: inline-flex; align-items: baseline; gap: 6px; font-size: 11.5px; color: var(--text); width: 150px; flex: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cass-key-col em { font-style: normal; color: var(--text-faint); font-size: 10px; }
  .cass-key-op { font-family: var(--mono); font-size: 12px; color: var(--text-dim); width: 26px; text-align: center; flex: none; }
  .cass-key-opsel { width: auto; }
  .cass-qb-inline { display: inline-flex; align-items: center; gap: 14px; flex: none; margin-left: 6px; }
  .cass-qb-limit { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; color: var(--text-dim); white-space: nowrap; }
  .cass-qb-limit select { height: 28px; background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; color: var(--text); font-size: 11.5px; padding: 0 6px; cursor: pointer; }
  .cass-qb-allow { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); background: none; border: none; cursor: pointer; padding: 0; white-space: nowrap; }
  .cass-qb-allow:hover { color: var(--text); }
  .cass-qb-allow.on { color: #e5a458; }
  .cass-qb-foot { display: flex; align-items: center; gap: 10px; }
  .cass-qb-warn-inline { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; color: #e5a458; }
  .cass-cql-preview { margin: 0; font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; white-space: pre-wrap; line-height: 1.55; }
  .cass-consistency { display: inline-flex; align-items: center; gap: 5px; color: var(--text-faint); }
  .cass-consistency .filter-select { max-width: 150px; }
  /* cql editor pane — mirrors the SQL query editor */
  .cass-cql-pane { border-bottom: 1px solid var(--border); background: var(--bg1); display: flex; flex-direction: column; }
  .cass-cql-editor-wrap { position: relative; min-height: 120px; height: 150px; background: var(--bg0); resize: vertical; overflow: hidden; }
  .cass-cql-highlight, .cass-cql-input { font-size: 12.5px !important; line-height: 1.6 !important; padding: 12px 14px !important; }
  .cass-cql-run { display: flex; align-items: center; gap: 12px; padding: 8px 14px; }
  /* standalone CQL query tab: editor grows, results below */
  .cass-cql-pane-full { flex: none; }
  .cass-cql-editor-wrap-full { height: 200px; min-height: 120px; }
  .cass-cql-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-faint); font-size: 12.5px; }
  .cass-cql-empty b { color: var(--text-dim); font-weight: 600; }
  /* results misc */
  .cass-warn { display: flex; align-items: center; gap: 7px; padding: 7px 14px; font-size: 11.5px; color: #e5a458; background: color-mix(in oklab, #e5a458 10%, transparent); border-bottom: 1px solid var(--border); }
  .cass-fix-btn { margin-top: 10px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: #e5a458; background: color-mix(in oklab, #e5a458 12%, transparent); border: 1px solid color-mix(in oklab, #e5a458 40%, var(--border)); border-radius: 7px; padding: 6px 11px; cursor: pointer; }
  .cass-fix-btn:hover { background: color-mix(in oklab, #e5a458 20%, transparent); }
  .cass-ddl-result, .cass-list-result { margin: 12px 14px; }
  .cass-list-item { font-family: var(--mono); font-size: 12px; color: var(--text-dim); padding: 3px 0; }
  /* structure */
  .cass-pk-summary { display: flex; flex-direction: column; gap: 4px; padding: 10px 18px; font-size: 12px; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  .cass-pk-clustering { color: var(--text-faint); font-size: 11px; }
  /* row editor modal */
  .cass-row-modal { width: 560px; max-width: calc(100vw - 48px); }
  .cass-row-form { display: flex; flex-direction: column; gap: 9px; max-height: 60vh; overflow-y: auto; padding: 4px 2px; }
  .cass-row-field { display: flex; flex-direction: column; gap: 4px; }
  .cass-row-label { display: flex; align-items: center; gap: 7px; font-size: 11px; }
  .cass-row-colname { font-family: var(--mono); color: var(--text); font-weight: 500; }
  .cass-row-coltype { font-family: var(--mono); color: var(--text-faint); font-size: 10px; }
  .cass-field { background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; font-size: 12px; color: var(--text); outline: none; width: 100%; }
  .cass-field:focus { border-color: var(--accent); }
  .cass-field:disabled { color: var(--text-faint); background: var(--bg1); }
  /* dashboard */
  .cass-dash-num { text-align: left; font-family: var(--mono); color: var(--text-dim); }
  .cass-dash-key { color: var(--accent); font-size: 11px; }
  .cass-dash-compaction { color: var(--text-faint); font-size: 11px; }
  .cass-cluster-meta { display: flex; gap: 18px; padding: 4px 2px 10px; font-size: 11.5px; color: var(--text-faint); }
  .cass-cluster-meta b { color: var(--text-dim); font-weight: 500; }
  .cass-nodetool .cass-node-up, .cass-node-up { color: #5ec27a; font-family: var(--mono); font-weight: 600; }
  /* create flows (keyspace / table / index) */
  .cass-create-modal { width: 540px; display: flex; flex-direction: column; gap: 13px; }
  .cass-create-modal > * { flex: none; }
  .cass-create-table { width: 680px; }
  .schema-pop-create { border-radius: 6px; }
  .schema-pop-create:hover { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .cass-field-grid { display: flex; gap: 14px; align-items: flex-start; }
  .cass-field { display: flex; flex-direction: column; gap: 6px; flex: 1; min-width: 0; }
  .cass-stepper { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--bg0); overflow: hidden; height: 32px; }
  .cass-stepper button { width: 34px; height: 100%; display: inline-flex; align-items: center; justify-content: center; color: var(--text-dim); }
  .cass-stepper button:hover:not(:disabled) { color: var(--accent); background: var(--bg2); }
  .cass-stepper button:disabled { opacity: .3; }
  .cass-stepper span { flex: 1; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--text); }
  .cass-check-row { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg0); font-size: 12px; color: var(--text-dim); text-align: left; }
  .cass-check-row:hover { border-color: color-mix(in oklab, var(--accent) 40%, var(--border)); }
  .cass-check-row b { color: var(--text); font-weight: 600; font-family: var(--mono); }
  .cass-ct-row { display: grid; grid-template-columns: 1.4fr 1.2fr 1fr 92px 26px; gap: 6px; align-items: center; }
  .cass-ct-head { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); padding: 0 2px; }
  .cass-ct-dash { text-align: center; color: var(--text-faint); font-family: var(--mono); }
  .cass-role-partition_key { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .cass-role-clustering { color: #61afef; border-color: color-mix(in oklab, #61afef 45%, var(--border)); }
  .cass-role-static { color: #e2b340; }
  .cass-create-note { display: flex; align-items: flex-start; gap: 7px; font-size: 11.5px; line-height: 1.5; color: var(--text-faint); margin: -2px 0 0; }
  .cass-create-note .micon { margin-top: 1px; flex: none; }
  .cass-create-note code { font-family: var(--mono); color: var(--text-dim); background: var(--bg2); padding: 0 4px; border-radius: 4px; }
  /* schema map edge tag */
  .cass-edge-tag { font-size: 9px; font-weight: 600; text-align: center; background: var(--bg1); border: 1px solid; border-radius: 5px; padding: 1px 0; line-height: 1.3; }

  /* explain */
  .mg-explain { border-bottom: 1px solid var(--border); background: var(--bg1); padding: 12px 14px; }
  .mg-explain-head { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text); margin-bottom: 10px; }
  .mg-explain-head .mg-ns { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .mg-explain-grid { display: flex; gap: 14px; flex-wrap: wrap; }
  .mg-plan-stage { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 8px; min-width: 220px; }
  .mg-plan-stage.ix { background: color-mix(in oklab, var(--accent) 12%, var(--bg2)); border: 1px solid color-mix(in oklab, var(--accent) 35%, transparent); color: var(--accent); }
  .mg-plan-stage.coll { background: color-mix(in oklab, #e2b340 14%, var(--bg2)); border: 1px solid color-mix(in oklab, #e2b340 40%, transparent); color: #e2b340; }
  .mg-plan-stage-name { font-family: var(--mono); font-size: 14px; font-weight: 600; }
  .mg-plan-stage-sub { font-size: 10.5px; color: var(--text-dim); font-family: var(--ui); }
  .mg-explain-stats { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .mg-estat { display: flex; flex-direction: column; }
  .mg-estat span { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; }
  .mg-estat b { font-size: 16px; color: var(--text); font-family: var(--mono); font-weight: 500; }
  .mg-explain-tip { margin-top: 10px; display: flex; align-items: center; gap: 6px; font-size: 11px; color: #e2b340; }

  /* terminal result table */
  .term-table-wrap { overflow-x: auto; margin: 4px 0 8px; }
  .term-result-table { border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
  .term-result-table th { text-align: left; padding: 3px 12px 3px 0; color: var(--text-faint); border-bottom: 1px solid var(--border); font-weight: 500; }
  .term-result-table td { padding: 2px 12px 2px 0; color: var(--text-dim); white-space: nowrap; }
  .term-result-table .mg-oid { color: #b08cff; }
  pre.term-json { color: #98c379; font-family: var(--mono); font-size: 11.5px; margin: 2px 0 6px; white-space: pre-wrap; }
  .term-foot { display: flex; align-items: center; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--border); flex: none; background: var(--bg1); flex-wrap: wrap; }

  /* dashboard yes/no */
  .mg-yes { display: inline-flex; align-items: center; gap: 4px; color: var(--accent); font-size: 11.5px; }
  .mg-no { color: var(--text-faint); }
  .mg-import-target { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text-dim); }
  .mg-import-target select { font-family: var(--mono); }
  /* schema actions menu (beside Tables count) */
  .sec-actions-btn { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 5px; color: var(--text-faint); }
  .sec-actions-btn:hover { color: var(--text); background: var(--bg3); }
  .sec-actions-btn.active { color: var(--accent); }
  .approx-note { display: flex; align-items: center; gap: 4px; font-size: 9.5px; color: var(--text-faint); padding: 2px 8px 6px; font-style: italic; }
  .sec-actions-menu { position: absolute; right: 0; top: calc(100% + 4px); min-width: 200px; text-transform: none; letter-spacing: normal; font-weight: 400; }
  .sec-actions-menu .ctx-item { font-weight: 400; }
  .schema-import-list { border: 1px solid var(--border); border-radius: 8px; overflow: hidden; max-height: 180px; overflow-y: auto; }
  .schema-import-row { display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 11.5px; border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); }
  .schema-import-row:last-child { border-bottom: none; }
  .schema-import-row.skipped { opacity: .55; }
  .schema-import-name { flex: 1; color: var(--text); }
  .schema-import-rows { color: var(--text-dim); }
  .schema-import-skip { color: #e2b340; font-size: 10px; }

  /* ---------- tab bar ---------- */
  .tabbar {
    display: flex; align-items: stretch; background: var(--bg1);
    border-bottom: 1px solid var(--border); height: 37px; flex: none;
  }
  .tabbar-tabs { display: flex; overflow-x: auto; scrollbar-width: none; }
  .tabbar-tabs::-webkit-scrollbar { display: none; }
  .tab {
    display: flex; align-items: center; gap: 7px; padding: 0 9px 0 12px;
    font-size: 12px; color: var(--text-dim); cursor: pointer; user-select: none;
    border-right: 1px solid var(--border); position: relative; white-space: nowrap;
    transition: background .1s; max-width: 200px;
  }
  .tab:hover { background: var(--bg2); }
  .tab.active { background: var(--bg0); color: var(--text); }
  .tab.active::after {
    content: ''; position: absolute; left: 0; right: 0; top: 0; height: 2px;
    background: var(--accent); border-radius: 0 0 2px 2px;
  }
  .tab-title { overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 11.5px; }
  .tab-close {
    display: inline-flex; align-items: center; justify-content: center;
    width: 17px; height: 17px; border-radius: 4px; color: var(--text-faint);
    opacity: 0; transition: opacity .1s;
  }
  .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
  .tab-close:hover { background: var(--bg3); color: var(--text); }
  .tab-new {
    display: flex; align-items: center; justify-content: center; width: 36px;
    color: var(--text-faint); transition: color .1s, background .1s; flex: none;
  }
  .tab-new:hover { color: var(--accent); background: var(--bg2); }
  .tabbar-tools { margin-left: auto; display: flex; align-items: center; padding-right: 6px; }
  .tabbar-tool {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border-radius: 7px;
    font-size: 12px; font-weight: 500; color: var(--text-dim); border: 1px solid transparent;
    transition: color .12s, background .12s, border-color .12s;
  }
  .tabbar-tool:hover { color: var(--text); background: var(--bg2); }
  .tabbar-tool.active { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--bg2)); border-color: color-mix(in oklab, var(--accent) 40%, transparent); }

  /* ================= VS Code-style terminal panel ================= */
  .term-panel { flex: none; display: flex; flex-direction: column; min-height: 0; background: var(--bg0); border-top: 1px solid var(--border); position: relative; }
  .term-panel.maximized { flex: 1 1 auto; }
  .term-resize { position: absolute; top: -3px; left: 0; right: 0; height: 6px; cursor: ns-resize; z-index: 5; }
  .term-resize:hover { background: color-mix(in oklab, var(--accent) 40%, transparent); }
  .term-panel-head { display: flex; align-items: stretch; height: 34px; flex: none; background: var(--bg1); border-bottom: 1px solid var(--border); }
  .term-tabs { display: flex; align-items: stretch; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
  .term-tabs::-webkit-scrollbar { display: none; }
  .term-tab {
    display: flex; align-items: center; gap: 7px; padding: 0 8px 0 12px; cursor: pointer;
    font-size: 11.5px; color: var(--text-dim); border-right: 1px solid var(--border); white-space: nowrap;
    position: relative; user-select: none; transition: background .1s;
  }
  .term-tab:hover { background: var(--bg2); }
  .term-tab.active { background: var(--bg0); color: var(--text); }
