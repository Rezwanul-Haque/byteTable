  .term-tab.active::after { content: ''; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: var(--accent); }
  .term-tab-title { font-family: var(--mono); font-size: 11px; }
  .term-tab-close { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; color: var(--text-faint); opacity: 0; transition: opacity .1s; }
  .term-tab:hover .term-tab-close, .term-tab.active .term-tab-close { opacity: 1; }
  .term-tab-close:hover { background: var(--bg3); color: var(--text); }
  .term-newtab { display: inline-flex; align-items: center; justify-content: center; width: 34px; color: var(--text-faint); transition: color .1s, background .1s; }
  .term-newtab:hover { color: var(--accent); background: var(--bg2); }
  .term-actions { display: flex; align-items: center; gap: 2px; padding: 0 6px; border-left: 1px solid var(--border); }
  .term-panel-body { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .term-schema { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); }
  .term-timing { font-family: var(--mono); font-size: 10.5px; color: var(--accent); }
  /* terminal result table colors (psql-style) */
  .term-thead { color: var(--text); font-weight: 500; }
  .term-rule { color: var(--text-faint); }
  .term-row { color: var(--text); }
  .term-meta { color: var(--text-faint); font-style: italic; }
  .term-help { color: var(--text-dim); }
  .term-prompt-str { white-space: pre; }
  /* terminal result HTML table */
  .term-grid-wrap { max-width: 100%; overflow-x: auto; margin: 4px 0 8px; border: 1px solid var(--border); border-radius: 8px; }
  .term-grid { border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; min-width: 100%; }
  .term-grid th { text-align: left; font-weight: 600; color: var(--text); background: var(--bg2); padding: 5px 12px; border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); white-space: nowrap; }
  .term-grid th:last-child { border-right: none; }
  .term-grid td { padding: 4px 12px; border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); border-right: 1px solid color-mix(in oklab, var(--border) 40%, transparent); white-space: nowrap; color: var(--text); }
  .term-grid td:last-child { border-right: none; }
  .term-grid tbody tr:last-child td { border-bottom: none; }
  .term-grid tbody tr:hover td { background: color-mix(in oklab, var(--bg2) 60%, transparent); }
  .term-grid-num { text-align: right; color: #7fb8e8; }
  .term-grid-null { color: var(--text-faint); font-style: italic; }
  .term-grid-empty { color: var(--text-faint); font-style: italic; padding: 8px 12px; }

  /* ---------- table data tab ---------- */
  /* DynamoDB engine */
  .ddb-key-line { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); padding: 2px 6px; }
  .ddb-idx-line { display: flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); padding: 2px 6px; }
  .ddb-idx-keys { color: var(--text-faint); }
  .ddb-key-badge { font-family: var(--mono); font-size: 8px; font-weight: 700; padding: 1px 4px; border-radius: 4px; letter-spacing: .04em; vertical-align: 1px; }
  .ddb-key-badge.pk { background: color-mix(in oklab, var(--accent) 20%, transparent); color: var(--accent); }
  .ddb-key-badge.sk { background: #e2b34022; color: #e2b340; }
  .ddb-row { cursor: pointer; }
  .ddb-json-chip { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: .92em; color: #c678dd; background: #c678dd14; border-radius: 4px; padding: 0 5px; }
  .ddb-toolbar { flex-wrap: wrap; }
  .ddb-scan-note { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--text-faint); }
  .ddb-op-tag { font-family: var(--mono); font-size: 9.5px; font-weight: 700; padding: 1px 7px; border-radius: 99px; letter-spacing: .05em; }
  .ddb-op-tag.q { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--accent); }
  .ddb-op-tag.s { background: #e2b34022; color: #e2b340; }
  .ddb-h { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--text-dim); margin: 0 0 10px; }
  .ddb-meta { display: flex; flex-direction: column; gap: 2px; max-width: 420px; }
  .ddb-meta-row { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 11.5px; padding: 5px 2px; border-bottom: 1px solid color-mix(in oklab, var(--border) 50%, transparent); }
  .ddb-meta-row span { color: var(--text-faint); }
  .ddb-meta-row b { color: var(--text); font-weight: 500; }
  .ddb-item-attrs { display: flex; flex-direction: column; gap: 1px; max-height: 260px; overflow-y: auto; border: 1px solid var(--border); border-radius: 9px; padding: 4px; }
  .ddb-attr-row { display: flex; align-items: center; gap: 9px; padding: 5px 8px; border-radius: 6px; font-family: var(--mono); font-size: 11.5px; }
  .ddb-attr-row:nth-child(odd) { background: color-mix(in oklab, var(--bg3) 45%, transparent); }
  .ddb-attr-type { width: 28px; flex: none; text-align: center; font-size: 9px; font-weight: 700; color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent); border-radius: 4px; padding: 1px 0; }
  .ddb-attr-name { width: 130px; flex: none; color: var(--text); display: flex; align-items: center; gap: 5px; }
  .ddb-attr-val { flex: 1; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* editable item modal */
  .ddb-item-edit .ddb-attr-row { align-items: flex-start; gap: 8px; padding: 5px 6px; }
  .ddb-item-edit .ddb-attr-row:nth-child(odd) { background: transparent; }
  .ddb-item-edit .ddb-attr-row.invalid { background: color-mix(in oklab, var(--danger) 12%, transparent); }
  .ddb-type-sel {
    width: 52px; flex: none; margin-top: 2px; background: var(--bg0); color: var(--accent);
    border: 1px solid var(--border); border-radius: 5px; font-family: var(--mono); font-size: 10px;
    font-weight: 700; padding: 3px 2px; text-align: center; outline: none; cursor: pointer;
  }
  .ddb-type-sel:focus { border-color: var(--accent); }
  .ddb-item-edit .ddb-attr-name { width: 132px; align-items: center; padding-top: 5px; white-space: nowrap; overflow: hidden; }
  .ddb-attr-nametext { overflow: hidden; text-overflow: ellipsis; }
  .ddb-lock { color: var(--text-faint); flex: none; }
  .ddb-attr-row.locked .ddb-attr-nametext { color: var(--text-dim); }
  .ddb-attr-val { overflow: visible; white-space: normal; }
  .ddb-val-input {
    width: 100%; background: var(--bg0); border: 1px solid var(--border); border-radius: 6px;
    padding: 5px 8px; font-family: var(--mono); font-size: 11.5px; color: var(--text); outline: none;
    transition: border-color .12s;
  }
  .ddb-val-input:focus { border-color: var(--accent); }
  .ddb-val-input.locked, .ddb-val-input:disabled { background: color-mix(in oklab, var(--bg0) 60%, var(--bg2)); color: var(--text-faint); cursor: not-allowed; }
  .ddb-val-json { resize: vertical; line-height: 1.4; color: #e5c07b; min-height: 30px; }
  .ddb-attr-row.invalid .ddb-val-json { border-color: var(--danger); }
  .ddb-attr-act { width: 22px; height: 26px; flex: none; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; }
  .ddb-attr-del { background: none; border: none; border-radius: 5px; color: var(--text-faint); cursor: pointer; }
  .ddb-attr-del:hover { color: var(--danger); background: color-mix(in oklab, var(--danger) 14%, transparent); }
  .ddb-edit-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
  .ddb-add-attr { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .ddb-add-attr .ddb-val-input { flex: 1; }
  .ddb-item-actions { margin-top: 14px; align-items: center; }
  .ddb-keys-hint { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-faint); }
  .ddb-json-err { color: var(--danger); font-weight: 500; }
  .ddl-block.invalid { border-color: color-mix(in oklab, var(--danger) 50%, var(--border)); }
  /* PartiQL editor: fixed editor, scrollable result region */
  .ddb-pq-editor { height: 96px; min-height: 72px; flex: none; }
  .ddb-pq-results { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .ddb-pq-grid { flex: 1; min-height: 0; overflow: auto; }
  .ddb-pq-grid .datagrid-wrap { height: 100%; }
  /* DynamoDB query bar (full-width, below toolbar) */
  .ddb-query-bar { display: flex; align-items: flex-end; gap: 12px; padding: 9px 14px; border-bottom: 1px solid var(--border); background: var(--bg1); flex: none; flex-wrap: wrap; }
  .ddb-q-field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 150px; }
  .ddb-q-field.ddb-q-index { flex: none; width: 200px; }
  .ddb-q-field.ddb-q-sk { flex: 2; min-width: 300px; }
  .ddb-q-field > span { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); display: flex; align-items: center; gap: 5px; }
  .ddb-q-field .where-input, .ddb-q-field .filter-select:not(.ddb-sk-op) { width: 100%; max-width: none; }
  .ddb-sk-row { display: flex; gap: 6px; }
  .ddb-q-field .ddb-sk-op { flex: none; width: 116px; max-width: 116px; }
  .ddb-sk-row .where-input { flex: 1; min-width: 140px; }

  /* ---------- table data tab ---------- */
  .table-tab { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .table-toolbar {
    display: flex; align-items: center; gap: 8px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex: none;
  }
  .where-label { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); }
  .where-input {
    flex: 1; background: var(--bg1); border: 1px solid var(--border); border-radius: 8px;
    font-family: var(--mono); font-size: 11.5px; padding: 6px 10px; outline: none;
    transition: border-color .12s; min-width: 0; color: var(--text);
  }
  .where-input:focus { border-color: var(--accent); }

  }
  .table-rowcount { font-family: var(--mono); font-size: 11px; color: var(--text-faint); white-space: nowrap; }

    padding: 5px 14px; font-size: 10.5px; color: var(--text-faint);
    border-top: 1px solid var(--border); flex: none; user-select: none;

  /* column picker */
  .col-count { font-family: var(--mono); font-size: 10px; color: var(--accent); }
  .col-pop {
    position: absolute; left: 0; top: calc(100% + 6px); z-index: 40; width: 244px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 14px 36px rgba(0,0,0,.45); padding: 6px; max-height: 360px;
    display: flex; flex-direction: column;
  }
  .col-pop-head { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; }
  .col-pop-head > span { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); }
  .col-pop-actions { display: flex; gap: 4px; }
  .col-pop-actions button { font-size: 10.5px; color: var(--text-dim); padding: 2px 8px; border-radius: 5px; border: 1px solid var(--border); }
  .col-pop-actions button:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
  .col-pop-list { overflow-y: auto; min-height: 0; }
  .col-pop-item { display: flex; align-items: center; gap: 7px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 11.5px; }
  .col-pop-item:hover { background: var(--bg3); }
  .col-pop-item input { position: absolute; opacity: 0; pointer-events: none; }
  .col-pop-check { width: 15px; height: 15px; border-radius: 4px; border: 1.5px solid var(--text-faint); display: inline-flex; align-items: center; justify-content: center; color: var(--on-accent); flex: none; }
  .col-pop-item input:checked + .col-pop-check { background: var(--accent); border-color: var(--accent); }
  .col-pop-name { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .col-pop-type { color: var(--text-faint); font-size: 9.5px; }
  /* pager */
  .table-footer { display: flex; align-items: center; gap: 12px; padding: 5px 14px; border-top: 1px solid var(--border); flex: none; }
  .table-footer .table-hint { border-top: none; padding: 0; flex: 1; }
  .pager { display: flex; align-items: center; gap: 7px; flex: none; }
  .pager-label { font-size: 10px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .08em; }
  .pager-size { background: var(--bg1); border: 1px solid var(--border); border-radius: 7px; font-family: var(--mono); font-size: 11.5px; padding: 3px 6px; outline: none; color: var(--text); }
  .pager-size:focus { border-color: var(--accent); }
  .pager-range { font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: nowrap; }

  /* ---------- data grid ---------- */
  .datagrid-wrap { flex: 1; overflow: auto; min-height: 0; }
  .datagrid { border-collapse: separate; border-spacing: 0; font-family: var(--mono); font-size: var(--grid-fs); width: max-content; min-width: 100%; }
  .datagrid th {
    position: sticky; top: 0; z-index: 2; background: var(--bg1);
    text-align: left; font-weight: 500; padding: 0 12px; height: 30px;
    border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
    white-space: nowrap; user-select: none;
  }
  .datagrid th.sortable { cursor: pointer; }
  .datagrid th.sortable:hover { background: var(--bg2); }
  .dg-head { display: inline-flex; align-items: center; gap: 5px; }
  .dg-colname { color: var(--text); font-size: 11.5px; }
  .dg-coltype { color: var(--text-faint); font-size: 9.5px; }
  .dg-rownum-h, .dg-rownum {
    position: sticky; left: 0; z-index: 1; background: var(--bg1); color: var(--text-faint);
    font-size: 10px; text-align: right; padding: 0 8px; min-width: 38px;
    border-right: 1px solid var(--border); user-select: none;
  }
  .dg-rownum-h { z-index: 3; }
  .datagrid td {
    padding: 0 12px; height: var(--grid-row-h); white-space: nowrap;
    border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent);
    border-right: 1px solid color-mix(in oklab, var(--border) 40%, transparent);
    max-width: 360px; overflow: hidden; text-overflow: ellipsis;
  }
  .datagrid tbody tr:hover td { background: color-mix(in oklab, var(--bg2) 70%, transparent); }
  .datagrid tbody tr:hover .dg-rownum { color: var(--text-dim); background: color-mix(in oklab, var(--bg2) 70%, var(--bg1)); }
  .datagrid tr.row-selected td { background: color-mix(in oklab, var(--accent) 7%, transparent); }
  .datagrid tr.row-selected .dg-rownum, .datagrid tbody tr:hover.row-selected .dg-rownum { background: color-mix(in oklab, var(--accent) 7%, var(--bg1)); }
  .datagrid tr.row-staged td { background: color-mix(in oklab, var(--accent) 11%, transparent); border-bottom-color: color-mix(in oklab, var(--accent) 30%, var(--border)); }
  .datagrid tr.row-staged .dg-rownum { color: var(--accent); background: color-mix(in oklab, var(--accent) 11%, var(--bg1)); }
  .dg-rownum { cursor: pointer; }
  .dg-rownum-eye { display: none; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; margin-left: auto; color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, var(--bg1)); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent); }
  .datagrid tbody tr:hover .dg-rownum-n { display: none; }
  .datagrid tbody tr:hover .dg-rownum-eye { display: inline-flex; }
  .dg-rownum:hover .dg-rownum-eye { background: color-mix(in oklab, var(--accent) 26%, var(--bg1)); }
  .dg-rownum.inspecting .dg-rownum-eye { display: inline-flex; }
  .dg-rownum.inspecting .dg-rownum-n { display: none; }
  .dg-rownum.inspecting { box-shadow: inset 2px 0 0 var(--accent); }
  /* row inspector drawer */
  .ri-scrim { position: fixed; inset: 0; background: rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 60; }
  .ri-scrim.show { opacity: 1; pointer-events: auto; }
  .ri-drawer { position: fixed; top: 36px; right: 0; bottom: 0; width: 420px; max-width: 88%; background: var(--bg1); border-left: 1px solid var(--border); box-shadow: -18px 0 48px rgba(0,0,0,.45); transform: translateX(102%); transition: transform .22s cubic-bezier(.4,.1,.2,1); z-index: 44; display: flex; flex-direction: column; }
  .ri-drawer.open { transform: translateX(0); }
  .ri-head { display: flex; align-items: center; gap: 9px; padding: 12px 12px 12px 14px; border-bottom: 1px solid var(--border); flex: none; }
  .ri-title { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .ri-title-main { font-size: 13.5px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ri-title-sub { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ri-nav { display: flex; align-items: center; gap: 2px; flex: none; }
  .ri-nav-btn { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: none; background: none; border-radius: 6px; color: var(--text-dim); cursor: pointer; }
  .ri-nav-btn:hover:not(:disabled) { background: var(--bg3); color: var(--text); }
  .ri-nav-btn:disabled { opacity: .35; cursor: default; }
  .ri-nav-pos { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); padding: 0 3px; }
  .ri-close { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: none; background: none; border-radius: 6px; color: var(--text-faint); cursor: pointer; flex: none; }
  .ri-close:hover { background: var(--bg3); color: var(--text); }
  .ri-body { flex: 1; overflow-y: auto; padding: 12px 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .ri-field { display: flex; flex-direction: column; gap: 5px; border-left: 2px solid transparent; padding-left: 9px; margin-left: -11px; }
  .ri-field.dirty { border-left-color: var(--accent); }
  .ri-field-head { display: flex; align-items: center; gap: 6px; min-height: 18px; }
  .ri-field-name { font-size: 11.5px; font-weight: 600; font-family: var(--mono); }
  .ri-field-type { font-size: 9.5px; color: var(--text-faint); font-family: var(--mono); }
  .ri-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-left: 2px; }
  .ri-input { width: 100%; background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; font-size: 12px; font-family: var(--mono); color: var(--text); outline: none; }
  .ri-input:focus { border-color: var(--accent); }
  .ri-ta { resize: vertical; line-height: 1.45; }
  .ri-json { border: 1px solid var(--border); border-radius: 8px; background: var(--bg0); overflow: hidden; }
  .ri-json.bad { border-color: color-mix(in oklab, var(--danger) 60%, var(--border)); }
  .ri-json-code { position: relative; overflow: hidden; }
  .ri-json-hl { position: absolute; inset: 0; margin: 0; padding: 7px 9px; font-size: 11.5px; font-family: var(--mono); line-height: 17px; overflow: auto; pointer-events: none; white-space: pre-wrap; word-break: break-word; }
  .ri-json-ta { position: absolute; inset: 0; width: 100%; height: 100%; border: none; background: none; outline: none; resize: none; padding: 7px 9px; font-size: 11.5px; font-family: var(--mono); color: transparent; caret-color: var(--text); line-height: 17px; display: block; white-space: pre-wrap; word-break: break-word; }
  .ri-json-ta::placeholder { color: var(--text-faint); }
  .ri-json-foot { display: flex; align-items: center; gap: 6px; padding: 4px 7px; border-top: 1px solid var(--border); background: var(--bg1); }
  .ri-json-ok { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--accent); }
  .ri-json-err { display: inline-flex; align-items: center; gap: 4px; font-size: 10px; color: var(--danger); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ri-mini-btn { display: inline-flex; align-items: center; gap: 3px; border: none; background: none; color: var(--text-faint); font-size: 10px; padding: 2px 6px; border-radius: 5px; cursor: pointer; font-family: var(--mono); }
  .ri-mini-btn:hover:not(:disabled) { background: var(--bg3); color: var(--text); }
  .ri-mini-btn:disabled { opacity: .4; cursor: default; }
  .ri-bool { display: flex; gap: 5px; }
  .ri-bool-btn { border: 1px solid var(--border); background: var(--bg0); color: var(--text-dim); font-size: 11px; font-family: var(--mono); padding: 4px 12px; border-radius: 7px; cursor: pointer; }
  .ri-bool-btn.on { border-color: var(--accent); color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
  .ri-bool-btn.null.on { border-color: var(--text-faint); color: var(--text-faint); background: var(--bg2); }
  .ri-bin-val { display: flex; align-items: center; gap: 7px; width: 100%; background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; cursor: pointer; color: var(--text); font-family: var(--mono); font-size: 11.5px; }
  .ri-bin-val:hover { border-color: var(--accent); }
  .ri-pk-lock { display: flex; align-items: center; gap: 8px; background: var(--bg2); border: 1px dashed var(--border); border-radius: 7px; padding: 6px 9px; font-size: 12px; font-family: var(--mono); }
  /* timestamp editor */
  .ri-dt { display: flex; flex-direction: column; gap: 6px; }
  .ri-dt > .ri-input { flex: 1; }
  .ri-dt:has(> .ri-input) { flex-direction: row; align-items: center; }
  .ri-dt-display { display: flex; align-items: center; gap: 7px; width: 100%; background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; padding: 6px 9px; cursor: pointer; color: var(--text); font-family: var(--mono); font-size: 12px; }
  .ri-dt-display:hover, .ri-dt-display.open { border-color: var(--accent); }
  .ri-dt-val { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ri-dt-tz { font-size: 9.5px; color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); border-radius: 4px; padding: 1px 5px; flex: none; }
  .ri-dt-panel { border: 1px solid var(--border); border-radius: 9px; background: var(--bg0); padding: 8px 9px 9px; display: flex; flex-direction: column; gap: 8px; }
  .ri-dt-toprow { display: flex; align-items: center; gap: 6px; }
  .ri-dt-tzsel { position: relative; }
  .ri-dt-tzbtn { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--border); background: var(--bg1); color: var(--text-dim); font-size: 10.5px; font-family: var(--mono); padding: 3px 8px; border-radius: 6px; cursor: pointer; }
  .ri-dt-tzbtn:hover { border-color: var(--text-faint); color: var(--text); }
  .ri-dt-tzmenu { position: absolute; top: 26px; left: 0; z-index: 5; min-width: 136px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.45); }
  .ri-dt-tzitem { display: flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 8px; border-radius: 5px; cursor: pointer; color: var(--text-dim); }
  .ri-dt-tzitem:hover { background: var(--bg3); color: var(--text); }
  .ri-dt-tzitem.on { color: var(--accent); }
  .ri-dt-tzdef { font-size: 8.5px; color: var(--text-faint); }
  .ri-dt-monthrow { display: flex; align-items: center; gap: 6px; }
  .ri-dt-month { font-size: 12px; font-weight: 600; flex: 1; }
  .ri-dt-year { display: flex; align-items: center; gap: 3px; font-size: 11.5px; font-family: var(--mono); color: var(--text-dim); position: relative; }
  .ri-dt-yrbtn { display: inline-flex; align-items: center; gap: 3px; border: 1px solid var(--border); background: var(--bg1); color: var(--text-dim); font-size: 11px; font-family: var(--mono); padding: 3px 7px; border-radius: 6px; cursor: pointer; }
  .ri-dt-yrbtn:hover { border-color: var(--text-faint); color: var(--text); }
  .ri-dt-yrmenu { position: absolute; top: 26px; right: 0; z-index: 5; width: 104px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 12px 32px rgba(0,0,0,.45); display: flex; flex-direction: column; gap: 4px; }
  .ri-dt-yrinput { width: 100%; border: 1px solid var(--border); background: var(--bg0); border-radius: 6px; outline: none; color: var(--text); font-size: 11px; font-family: var(--mono); padding: 4px 7px; }
  .ri-dt-yrinput:focus { border-color: var(--accent); }
  .ri-dt-yrlist { max-height: 200px; overflow-y: auto; }
  .ri-dt-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 6px; }
  .ri-dt-dow { font-size: 9px; color: var(--text-faint); text-align: center; padding: 2px 0; }
  .ri-dt-day { border: none; background: none; color: var(--text-dim); font-size: 10.5px; font-family: var(--mono); height: 24px; border-radius: 6px; cursor: pointer; }
  .ri-dt-day:hover { background: var(--bg3); color: var(--text); }
  .ri-dt-day.on { background: var(--accent); color: #0c1210; font-weight: 700; }
  .ri-dt-clock { display: flex; align-items: center; gap: 5px; border-top: 1px solid var(--border); padding-top: 8px; }
  .ri-dt-colon { color: var(--text-faint); font-family: var(--mono); }
  .ri-dt-stored { margin-left: auto; font-size: 9px; color: var(--text-faint); text-align: right; line-height: 1.35; max-width: 110px; }
  .ri-step { display: flex; flex-direction: column; align-items: center; background: var(--bg1); border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  .ri-step-btn { display: inline-flex; align-items: center; justify-content: center; border: none; background: none; color: var(--text-faint); cursor: pointer; width: 30px; height: 15px; padding: 0; }
  .ri-step-btn:hover { color: var(--accent); background: var(--bg3); }
  .ri-step-val { width: 30px; border: none; background: none; outline: none; color: var(--text); font-size: 12px; font-family: var(--mono); text-align: center; padding: 1px 0; }
  .ri-pk-note { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; font-size: 9.5px; color: var(--text-faint); }
  .ri-foot { flex: none; display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-top: 1px solid var(--border); background: var(--bg1); min-height: 46px; }
  .ri-foot.dirty { border-top-color: color-mix(in oklab, var(--accent) 40%, var(--border)); background: color-mix(in oklab, var(--accent) 6%, var(--bg1)); }
  .ri-foot-n { font-size: 12px; font-weight: 600; }
  .ri-foot-hint { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-faint); line-height: 1.4; }
  .ri-btn { display: inline-flex; align-items: center; gap: 5px; border-radius: 7px; font-size: 12px; font-weight: 600; padding: 6px 12px; cursor: pointer; border: 1px solid transparent; }
  .ri-btn.ghost { background: none; border-color: var(--border); color: var(--text-dim); }
  .ri-btn.ghost:hover { color: var(--text); border-color: var(--text-faint); }
  .ri-btn.primary { background: var(--accent); color: #0c1210; }
  .ri-btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .ri-btn.primary:disabled { opacity: .45; cursor: default; }
  .save-bar { display: flex; align-items: center; gap: 9px; padding: 7px 14px; border-top: 1px solid color-mix(in oklab, var(--accent) 40%, var(--border)); background: color-mix(in oklab, var(--accent) 6%, var(--bg1)); flex: none; }
  .save-bar-count { font-size: 12px; font-weight: 600; }
  .save-bar-hint { font-size: 11px; color: var(--text-faint); }
  /* create table modal */
  .createtable-modal { width: 600px; }
  .ct-schema { font-family: var(--mono); font-size: 11px; color: var(--text-faint); margin-left: 2px; }
  .ct-cols-head { display: flex; align-items: center; justify-content: space-between; }
  .ct-cols { display: flex; flex-direction: column; gap: 4px; max-height: 230px; overflow-y: auto; }
  .ct-row { display: grid; grid-template-columns: 1.3fr 1.2fr 32px 44px 1fr 26px; gap: 6px; align-items: center; }
  .ct-row-head { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); padding: 0 2px; }
  .ct-in { background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; padding: 6px 8px; font-family: var(--mono); font-size: 11.5px; outline: none; color: var(--text); min-width: 0; }
  .ct-in:focus { border-color: var(--accent); }
  .ct-sel { background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; padding: 6px 4px; font-family: var(--mono); font-size: 11px; outline: none; color: var(--text); min-width: 0; }
  .ct-flag { display: inline-flex; align-items: center; justify-content: center; height: 28px; border-radius: 7px; border: 1px solid var(--border); background: var(--bg0); color: var(--text-dim); font-family: var(--mono); font-size: 10.5px; }
  .ct-flag.on { color: var(--accent); border-color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, var(--bg0)); }
  .ct-flag:disabled { opacity: .4; }
  .ct-drop { display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 28px; border-radius: 7px; color: var(--text-faint); }
  .ct-drop:hover:not(:disabled) { color: #e06c75; background: #e06c7518; }
  .ct-drop:disabled { opacity: .3; }
  .ct-ddl-label { font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
  .ct-ddl { max-height: 120px; overflow: auto; margin: 0; }
  .datagrid td.cell-selected { outline: 1.5px solid var(--accent); outline-offset: -1.5px; border-radius: 2px; }
  .cell-null { color: var(--text-faint); font-style: italic; font-size: .92em; }
  .cell-num { color: #7fb8e8; display: block; text-align: right; }
  .cell-true { color: var(--accent); }
  .cell-false { color: #e06c75; }
  .cell-dim { color: var(--text-faint); }
  .cell-text { color: var(--text); }
  .cell-pill { padding: 1.5px 8px; border-radius: 99px; font-size: .92em; }
  /* JSON cell + editor */
  .json-cell { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; padding: 0; cursor: pointer; }
  .json-cell-prev { font-family: var(--mono); font-size: .92em; color: #e5c07b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .json-cell:hover .json-cell-prev { text-decoration: underline; text-decoration-color: color-mix(in oklab, #e5c07b 50%, transparent); text-underline-offset: 2px; }
  .json-modal { width: 600px; max-width: calc(100vw - 48px); }
  .json-title-col { font-family: var(--mono); font-size: 13px; color: var(--text-dim); }
  .json-title-col b { color: var(--text); font-weight: 600; }
  .json-type-tag { font-family: var(--mono); font-size: 9.5px; font-weight: 600; color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent); border-radius: 5px; padding: 1px 7px; }
  .json-toolbar { display: flex; align-items: center; gap: 8px; }
  .json-tool { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--text-dim); padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); }
  .json-tool:hover:not(:disabled) { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
  .json-tool:disabled { opacity: .4; cursor: default; }
  .json-editor-wrap { display: flex; height: 300px; background: var(--bg0); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .json-gutter { flex: none; padding: 12px 0; background: var(--bg1); border-right: 1px solid var(--border); overflow: hidden; text-align: right; user-select: none; }
  .json-ln { font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--text-faint); padding: 0 10px; }
  .json-ln.err { color: #e06c75; background: #e06c7518; }
  .json-code { position: relative; flex: 1; min-width: 0; }
  .json-highlight, .json-input { position: absolute; inset: 0; margin: 0; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre; overflow: auto; tab-size: 2; }
  .json-highlight { pointer-events: none; color: var(--text); }
  .json-input { background: transparent; border: none; outline: none; resize: none; color: transparent; caret-color: var(--accent); }
  .jx-key { color: #61afef; }
  .jx-str { color: #98c379; }
  .jx-num { color: #d19a66; }
  .jx-bool { color: #c678dd; }
  .jx-null { color: #e06c75; }
  .jx-punct { color: var(--text-dim); }
  .json-tree-wrap { height: 300px; overflow: auto; background: var(--bg0); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; font-family: var(--mono); font-size: 12.5px; line-height: 1.7; }
  .jtree-node { }
  .jtree-toggle { display: inline-flex; align-items: center; gap: 2px; color: var(--text-dim); padding: 0; }
  .jtree-toggle:hover { color: var(--text); }
  .jtree-collapsed { color: var(--text-faint); margin-left: 2px; }
  .jtree-children { padding-left: 18px; border-left: 1px solid var(--border); margin-left: 6px; }
  .jtree-row { display: flex; }
  .json-status { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 11.5px; padding: 8px 11px; border-radius: 8px; }
  .json-status.ok { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
  .json-status.err { color: #e06c75; background: #e06c7512; }
  .json-hint { flex: 1; font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); }
  /* binary / UUID cell + editor */
  .bin-cell { display: inline-flex; align-items: center; gap: 6px; max-width: 100%; padding: 0; cursor: pointer; }
  .bin-badge { font-family: var(--mono); font-size: 8.5px; font-weight: 600; letter-spacing: .03em; color: #56b6c2; background: #56b6c21f; border: 1px solid #56b6c244; border-radius: 4px; padding: 0 4px; line-height: 1.5; flex: none; }
  .bin-val { font-family: var(--mono); font-size: .92em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bin-val.uuid { color: #56b6c2; }
  .bin-val.hex { color: #d19a66; }
  .bin-val.blob { color: var(--text-faint); font-style: italic; }
  .bin-cell:hover .bin-val { text-decoration: underline; text-decoration-color: color-mix(in oklab, currentColor 45%, transparent); text-underline-offset: 2px; }
  .binary-modal { width: 460px; }
  .binary-field { display: flex; flex-direction: column; gap: 6px; }
  .binary-label { font-size: 11.5px; color: var(--text-dim); font-weight: 500; }
  .binary-sub { color: var(--text-faint); font-weight: 400; font-family: var(--mono); font-size: 10.5px; margin-left: 6px; }
  .binary-input { background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px; font-family: var(--mono); font-size: 13.5px; letter-spacing: .02em; outline: none; color: var(--text); }
  .binary-input:focus { border-color: var(--accent); }
  .binary-input.err { border-color: #e06c75; }
  .binary-repr { background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 4px 0; }
  .binary-repr-row { display: flex; align-items: center; gap: 12px; padding: 6px 12px; font-size: 11.5px; }
  .binary-repr-row span { width: 86px; flex: none; color: var(--text-faint); font-family: var(--mono); }
  .binary-repr-row code { font-family: var(--mono); color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell-input {
    width: 100%; background: var(--bg0); border: none; outline: none;
    font-family: var(--mono); font-size: var(--grid-fs); padding: 0; color: var(--text);
  }
  .datagrid td.cell-editing { outline: 1.5px solid var(--accent); outline-offset: -1.5px; background: var(--bg0); }
  .datagrid td.cell-edited { background: color-mix(in oklab, var(--accent) 15%, transparent); box-shadow: inset 2px 0 0 var(--accent); }
  .grid-empty, .grid-empty-cell { padding: 28px; text-align: center; color: var(--text-faint); font-size: 12.5px; font-family: var(--ui); }

  /* ---------- SQL editor ---------- */
  .sql-tab { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
  .sql-toolbar {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px;
    border-bottom: 1px solid var(--border); flex: none;
  }
  .sql-hint { font-size: 10.5px; color: var(--text-faint); white-space: nowrap; }
  .sql-snippets { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .sql-snippets::-webkit-scrollbar { display: none; }
  .snippet-chip {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
    background: var(--bg2); border: 1px solid var(--border); border-radius: 99px;
    padding: 3px 10px; white-space: nowrap; transition: color .1s, border-color .1s;
  }
  .snippet-chip:hover { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 50%, transparent); }

  .sql-editor-wrap {
    position: relative; height: 38%; min-height: 110px; flex: none;
    border-bottom: 1px solid var(--border); background: var(--bg0);
    display: flex;
  }
  .sql-editor-main { position: relative; flex: 1; min-width: 0; }
  .sql-format-fab { position: absolute; top: 8px; right: 14px; z-index: 3; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border-radius: 7px; color: var(--text-faint); background: color-mix(in oklab, var(--bg2) 80%, transparent); border: 1px solid var(--border); opacity: 0; transition: opacity .12s, color .12s, border-color .12s; }
  .sql-editor-wrap:hover .sql-format-fab { opacity: 1; }
  .sql-format-fab:hover { color: var(--accent); border-color: var(--accent); }
  .ac-popup { position: absolute; z-index: 20; min-width: 200px; max-width: 280px; max-height: 240px; overflow-y: auto; background: var(--bg2); border: 1px solid var(--border); border-radius: 9px; box-shadow: 0 14px 36px rgba(0,0,0,.5); padding: 4px; }
  .ac-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; cursor: pointer; font-family: var(--mono); font-size: 12px; }
  .ac-item.sel { background: color-mix(in oklab, var(--accent) 16%, var(--bg3)); }
  .ac-label { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ac-hint { font-size: 10px; color: var(--text-faint); }
  .ac-kind { font-size: 9.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; }
  .sql-highlight, .sql-input {
    position: absolute; inset: 0; padding: 12px 16px; margin: 0;
    font-family: var(--mono); font-size: var(--editor-fs, 13px); line-height: 1.65;
    white-space: pre; overflow: auto; tab-size: 2;
  }
  .sql-highlight { pointer-events: none; color: var(--text); scrollbar-width: none; }
  .sql-highlight::-webkit-scrollbar { display: none; }
  .sql-input {
    background: transparent; border: none; outline: none; resize: none;
    color: transparent; caret-color: var(--accent);
  }
  .sql-kw { color: var(--accent); font-weight: 500; }
  .sql-string { color: #e5c07b; }
  .sql-num { color: #7fb8e8; }
  .sql-func { color: #c678dd; }
  .sql-comment { color: var(--text-faint); font-style: italic; }

  /* execution-order minimap */
  .exec-minimap {
    width: 224px; flex: none; border-left: 1px solid var(--border); background: var(--bg1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .exec-mini-title { display: flex; align-items: center; gap: 5px; padding: 8px 10px 6px; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
  .exec-mini-cols { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 2px; overflow-y: auto; padding: 0 5px; }
  .exec-mini-stmt { display: flex; align-items: center; gap: 4px; padding: 4px 10px 0; font-size: 9.5px; color: var(--text); font-weight: 600; }
  .exec-mini-stmt-hint { color: var(--text-faint); font-weight: 400; }
  .exec-mini-col { min-width: 0; }
  .exec-mini-collabel { font-size: 10px; font-weight: 600; color: var(--text); padding: 2px 5px 0; }
  .exec-mini-colsub { font-size: 8.5px; color: var(--text-faint); padding: 0 5px 4px; }
  .exec-mini-step { display: flex; align-items: center; gap: 6px; padding: 2.5px 5px; border-radius: 5px; }
  .exec-mini-step .exec-mini-num {
    width: 15px; height: 15px; flex: none; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 9px; background: var(--bg3); color: var(--text-faint);
  }
  .exec-mini-step .exec-mini-kw { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .exec-mini-step.on .exec-mini-num { background: var(--accent); color: var(--on-accent); font-weight: 600; }
  .exec-mini-step.on .exec-mini-kw { color: var(--text); }
  .exec-mini-foot { padding: 6px 10px 8px; font-size: 9px; line-height: 1.45; color: var(--text-faint); border-top: 1px solid var(--border); }

  /* explain & analyze panel */
  .result-tab { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); padding: 2px 8px; border-radius: 6px; }
  .result-tab:hover { color: var(--text); background: var(--bg2); }
  .result-tab.active { color: var(--accent); }
  .explain-bar { gap: 4px; }
  .explain-panel { flex: 1; min-height: 0; overflow-y: auto; }
  .explain-cols { display: grid; grid-template-columns: 1.15fr 1fr; gap: 0; min-height: 100%; }
  .explain-steps { padding: 14px 16px; border-right: 1px solid var(--border); }
  .explain-plan { padding: 14px 16px; }
  .explain-h { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim); margin-bottom: 12px; }
  .explain-step { display: flex; gap: 10px; margin-bottom: 12px; }
  .explain-step-n { width: 20px; height: 20px; flex: none; border-radius: 6px; background: color-mix(in oklab, var(--accent) 16%, var(--bg2)); color: var(--accent); font-family: var(--mono); font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
  .explain-step-body { flex: 1; min-width: 0; }
  .explain-step-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .explain-step-kw { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--text); }
  .explain-step-extra { font-family: var(--mono); font-size: 10.5px; color: #e5c07b; background: var(--bg1); border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .explain-step-rows { margin-left: auto; font-family: var(--mono); font-size: 10px; color: var(--text-faint); background: var(--bg1); border-radius: 99px; padding: 1px 8px; }
  .explain-step-desc { font-size: 11.5px; color: var(--text-dim); line-height: 1.5; margin-top: 3px; }
  .explain-plan-tree { font-family: var(--mono); font-size: 11.5px; line-height: 1.7; color: var(--text); background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; overflow-x: auto; white-space: pre; }
  .explain-plan-foot { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-dim); margin-top: 12px; }
  .explain-plan-foot b { color: var(--text); font-weight: 600; }
  .explain-note { font-size: 10.5px; color: var(--text-faint); margin-top: 8px; line-height: 1.5; }
  .ex-summary { display: flex; align-items: center; gap: 18px; padding: 10px 16px; border-bottom: 1px solid var(--border); background: var(--bg1); position: sticky; top: 0; z-index: 3; flex-wrap: wrap; }
  .ex-sum-sp { flex: 1; }
  .ex-stat { display: flex; flex-direction: column; gap: 1px; }
  .ex-stat span { font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
  .ex-stat b { font-family: var(--mono); font-size: 12.5px; color: var(--text); font-weight: 600; display: flex; align-items: baseline; gap: 5px; }
  .ex-stat b.warn { color: var(--warn); }
  .ex-stat b i { font-family: var(--ui); font-style: normal; font-size: 10px; font-weight: 400; color: var(--text-faint); }
  .ex-modes .seg-btn { font-size: 11px; }
  .ex-cols { display: grid; grid-template-columns: 1.35fr 1fr; align-items: start; }
  .ex-pane { padding: 13px 16px 16px; min-width: 0; }
  .ex-treepane { border-left: 1px solid var(--border); }
  .ex-h-note { margin-left: auto; font-size: 9.5px; letter-spacing: .04em; text-transform: none; color: var(--text-faint); font-weight: 400; }
  .ex-table-wrap { border: 1px solid var(--border); border-radius: 10px; overflow: hidden; background: var(--bg1); }
  .ex-table { width: 100%; border-collapse: collapse; font-size: 11.5px; }
  .ex-table th { text-align: left; font-size: 9.5px; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); font-weight: 600; padding: 7px 10px; background: var(--bg2); border-bottom: 1px solid var(--border); }
  .ex-table th.num, .ex-table td.num { text-align: right; }
  .ex-table th.share { width: 150px; }
  .ex-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .ex-table tr:last-child td { border-bottom: none; }
  .ex-table tbody tr { cursor: pointer; }
  .ex-table tbody tr:hover { background: var(--bg2); }
  .ex-table tbody tr.sel { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .ex-ord { font-family: var(--mono); color: var(--text-faint); width: 26px; }
  .ex-node-cell { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
  .ex-nic { flex: none; margin-top: 1px; color: var(--accent); }
  .ex-nic.scan { color: var(--warn); }
  .ex-nic.sort { color: #c792ea; }
  .ex-nic.agg { color: #e2b340; }
  .ex-node-name { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
  .ex-node-detail { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; line-height: 1.45; word-break: break-word; }
  .ex-rows { font-family: var(--mono); color: var(--text-dim); white-space: nowrap; }
  .ex-rows i { font-style: normal; color: var(--text-faint); font-size: 10px; }
  .ex-ms { font-family: var(--mono); color: var(--text); white-space: nowrap; }

  /* ---------- structure view (v3: two-pane) ---------- */
  .structure-view { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .structure-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 12px; border-bottom: 1px solid var(--border); flex: none; }
  .structure-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .structure-chip {
    font-family: var(--mono); font-size: 10.5px; color: var(--text-faint);

    white-space: nowrap;
  }
  .structure-chip b { color: var(--text); font-weight: 600; }

    flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 348px; gap: 0;
  }

    border-bottom: 1px solid var(--border); flex: none;
  }

  .columns-search {
    display: flex; align-items: center; gap: 6px; flex: 1; max-width: 320px;

    transition: border-color .12s;

  .columns-count { font-family: var(--mono); font-size: 10.5px; color: var(--text-faint); margin-left: auto; }

  .structure-rail { overflow-y: auto; min-height: 0; padding: 14px 16px 18px; background: color-mix(in oklab, var(--bg1) 55%, var(--bg0)); display: flex; flex-direction: column; }
  .rail-section { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; }
  .rail-scroll { overflow-y: auto; min-height: 0; max-height: 168px; padding-right: 2px; }
  .rail-scroll::-webkit-scrollbar { width: 8px; }

  .structure-card:hover .card-drop { opacity: 1; }
  .card-drop:hover { color: #e06c75; background: #e06c7518; }
  .rail-readonly-note { font-size: 9.5px; color: var(--text-faint); font-style: italic; padding: 4px 2px 0; }
  /* structure rail accordion */
  .structure-rail.accordion { padding: 8px 10px; gap: 4px; }
  .acc-section { display: flex; flex-direction: column; min-height: 0; border: 1px solid var(--border); border-radius: 9px; background: var(--bg1); flex: none; }
  .acc-section.open { flex: 1 1 auto; }
  .acc-head { display: flex; align-items: center; gap: 7px; width: 100%; padding: 9px 10px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); cursor: pointer; }
  .acc-head:hover { color: var(--text); }

  .acc-head .rail-add, .acc-head .ddl-copy { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .acc-body { display: flex; flex-direction: column; min-height: 0; padding: 0 10px 10px; }
  .acc-scroll { overflow-y: auto; min-height: 0; flex: 1 1 auto; }
  .acc-ddl-block { overflow: auto; min-height: 0; flex: 1 1 auto; margin: 0; }
  .st-addform { background: var(--bg0); border: 1px solid var(--accent); border-radius: 9px; padding: 9px; margin-bottom: 8px; display: flex; flex-direction: column; gap: 8px; }
  .st-addform-cols { display: flex; flex-wrap: wrap; gap: 5px; }

  .st-chip.on { background: color-mix(in oklab, var(--accent) 18%, var(--bg2)); color: var(--accent); border-color: var(--accent); }

  .st-addform-actions { display: flex; justify-content: flex-end; gap: 6px; }
  .st-fk-grid { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .st-fk-grid .filter-select { flex: 1; min-width: 64px; }
  .st-fk-arrow { color: var(--text-faint); }
  .rail-count {
    font-family: var(--mono); font-size: 10px; color: var(--text-faint);
    background: var(--bg2); border-radius: 99px; padding: 1px 7px; font-weight: 500; letter-spacing: 0;
  }

  .structure-section { margin-bottom: 20px; }

    display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim); margin-bottom: 9px;
  }

  .st-icon { width: 20px; padding-right: 0 !important; }

  .st-type { color: #c678dd; }
  .st-default code { color: #e5c07b; }
  .structure-card {
    background: var(--bg1); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 12px; margin-bottom: 7px;
  }
  .structure-card-name { font-family: var(--mono); font-size: 11.5px; font-weight: 500; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; word-break: break-all; }
  .structure-card-detail { font-family: var(--mono); font-size: 10.5px; color: var(--text-dim); margin-top: 4px; word-break: break-all; }
  .structure-none { font-size: 12px; color: var(--text-faint); }
  .ddl-preview { position: relative; cursor: pointer; border-radius: 10px; overflow: hidden; }
  .ddl-preview-block { max-height: 218px; overflow: hidden; margin: 0; }
  .ddl-preview:hover .ddl-block { border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }

    position: absolute; left: 1px; right: 1px; bottom: 1px; height: 74px; border-radius: 0 0 10px 10px;
    background: linear-gradient(transparent, var(--bg1) 78%);
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 9px;
  }
  .ddl-fade-hint {
    display: inline-flex; align-items: center; gap: 5px;
    font-family: var(--mono); font-size: 10.5px; color: var(--text-dim);
    background: var(--bg2); border: 1px solid var(--border); border-radius: 99px; padding: 3px 10px;
  }
  .ddl-preview:hover .ddl-fade-hint { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .ddl-modal { width: 660px; max-height: 82vh; }
  .ddl-modal-block { overflow: auto; min-height: 0; flex: 1; }
  .map-col-more .map-col-name { color: var(--text-faint); font-style: italic; }

  /* ---------- structure editing (v4) ---------- */
  .add-col-btn {
    display: inline-flex; align-items: center; gap: 5px; flex: none;
    font-size: 11.5px; font-weight: 500; color: var(--accent);
    background: color-mix(in oklab, var(--accent) 12%, var(--bg2));
    border-radius: 7px; padding: 5px 10px; transition: background .12s;
  }
  .add-col-btn:hover { background: color-mix(in oklab, var(--accent) 20%, var(--bg2)); }

  .st-editable:hover { background: var(--bg2); box-shadow: 0 0 0 1px var(--border); }

    background: var(--bg0); border: 1px solid var(--accent); border-radius: 5px;
    font-family: var(--mono); font-size: 11.5px; padding: 2px 6px; outline: none;
    color: var(--text); width: 150px;
  }
  .st-type-select {
    background: var(--bg0); border: 1px solid var(--accent); border-radius: 5px;
    font-family: var(--mono); font-size: 11px; padding: 2px 4px; outline: none;
    color: #c678dd; max-width: 140px;
  }

    position: absolute; top: 100%; left: 0; z-index: 60; margin-top: 3px;

    box-shadow: 0 10px 28px rgba(0,0,0,.4);

  .st-actions { width: 30px; }
  .st-drop {
    display: inline-flex; align-items: center; justify-content: center;

    opacity: 0; transition: opacity .1s;
  }

  .st-drop:hover { color: #e06c75; background: #e06c7518; }
  .st-row-new td { background: color-mix(in oklab, var(--accent) 7%, transparent); }
  .st-edit-hint { padding: 9px 2px 0; font-size: 10.5px; color: var(--text-faint); user-select: none; }
  .pending-bar {
    flex: none; border-top: 1px solid color-mix(in oklab, var(--accent) 40%, var(--border));

  }

  .pending-list-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); margin-bottom: 7px; }
  .pending-sql {
    font-family: var(--mono); font-size: 11px; line-height: 1.5; margin: 0 0 5px;
    padding: 5px 9px; background: var(--bg0); border: 1px solid var(--border); border-radius: 7px;

  }

  /* ---------- command palette ---------- */

    box-shadow: 0 28px 70px rgba(0,0,0,.55);

    display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px;
    cursor: pointer; font-size: 13px;
  }
  .palette-item.active { background: color-mix(in oklab, var(--accent) 10%, var(--bg2)); }
  .palette-label { flex: 1; font-family: var(--mono); font-size: 12.5px; }

  /* ---------- status bar ---------- */
  .statusbar {
    grid-area: status; display: flex; align-items: center; gap: 10px;
    background: var(--bg1); border-top: 1px solid var(--border); padding: 0 12px;
    font-size: 11px; color: var(--text-dim); user-select: none;
  }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); flex: none; }
  .status-strong { font-weight: 600; color: var(--text); }
  .status-dim { color: var(--text-faint); font-family: var(--mono); font-size: 10.5px; }
  .mock-tag { border: 1px dashed var(--text-faint); border-radius: 5px; padding: 0 6px; }
  .status-btn { display: inline-flex; align-items: center; gap: 4px; border: none; background: none; color: var(--text-faint); font-family: var(--mono); font-size: 10.5px; padding: 2px 6px; border-radius: 5px; cursor: pointer; }
  .status-btn:hover { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }

  /* ---------- processes tab ---------- */
  .proc-tab { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .proc-toolbar { display: flex; align-items: center; gap: 9px; padding: 10px 14px; border-bottom: 1px solid var(--border); flex: none; }
  .proc-title { font-size: 13.5px; font-weight: 600; }
  .proc-src { font-family: var(--mono); font-size: 10px; color: var(--text-faint); background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 2px 7px; }
  .proc-search { display: flex; align-items: center; gap: 6px; background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 5px 9px; width: 300px; color: var(--text-faint); }
  .proc-search input { flex: 1; border: none; background: none; outline: none; color: var(--text); font-size: 12px; }
  .proc-search:focus-within { border-color: var(--accent); }
  .proc-search-x { display: inline-flex; border: none; background: none; color: var(--text-faint); cursor: pointer; padding: 0; }
  .proc-stat { font-size: 11px; color: var(--text-faint); }
  .proc-stat b { color: var(--text); font-weight: 600; }
  .proc-stat.run b { color: var(--accent); }
  .proc-stat.warn b { color: #e5c07b; }
  .proc-auto { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); background: var(--bg2); color: var(--text-faint); font-size: 10.5px; font-family: var(--mono); padding: 3px 8px; border-radius: 6px; cursor: pointer; }
  .proc-auto.on { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); background: color-mix(in oklab, var(--accent) 10%, transparent); }
  .proc-auto.on .msym { animation: proc-spin 2.5s linear infinite; }
  @keyframes proc-spin { to { transform: rotate(360deg); } }
  .proc-actionbar { display: flex; align-items: center; gap: 10px; padding: 7px 14px; border-bottom: 1px solid var(--border); background: color-mix(in oklab, var(--danger) 6%, var(--bg1)); font-size: 12px; font-weight: 600; flex: none; }
  .proc-clear { border: none; background: none; color: var(--text-faint); font-size: 11px; cursor: pointer; }
  .proc-clear:hover { color: var(--text); }
  .proc-scroll { flex: 1; overflow: auto; min-height: 0; }
  .proc-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .proc-table th { position: sticky; top: 0; z-index: 2; text-align: left; font-size: 10px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--text-faint); background: var(--bg1); border-bottom: 1px solid var(--border); padding: 7px 10px; white-space: nowrap; }
  .proc-table td { border-bottom: 1px solid var(--border); padding: 6px 10px; white-space: nowrap; }
  .proc-table tbody tr { cursor: default; }
  .proc-table tbody tr:hover td { background: var(--bg2); }
  .proc-table tbody tr.checked td { background: color-mix(in oklab, var(--accent) 7%, transparent); }
  .proc-th-check, .proc-td-check { width: 30px; }
  .proc-td-check input { accent-color: var(--accent); }
  .proc-table .mono { font-family: var(--mono); font-size: 11.5px; }
  .proc-table .dim { color: var(--text-faint); }
  .proc-self { font-size: 8.5px; font-weight: 700; color: var(--accent); background: color-mix(in oklab, var(--accent) 14%, transparent); border-radius: 4px; padding: 1px 4px; margin-left: 6px; vertical-align: 1px; }
  .proc-state { font-size: 10px; font-family: var(--mono); border-radius: 5px; padding: 2px 7px; }
  .proc-state.run { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .proc-state.idle { color: var(--text-faint); background: var(--bg2); }
  .proc-state.warn { color: #e5c07b; background: color-mix(in oklab, #e5c07b 12%, transparent); }
  .proc-th-q { width: 44%; }
  .proc-td-q { max-width: 0; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); }
  .proc-td-kill { width: 34px; }
  .proc-kill { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border: none; background: none; border-radius: 6px; color: var(--text-faint); cursor: pointer; opacity: 0; }
  .proc-table tbody tr:hover .proc-kill { opacity: 1; }
  .proc-kill:hover:not(:disabled) { color: var(--danger); background: color-mix(in oklab, var(--danger) 12%, transparent); }
  .proc-kill:disabled { cursor: default; opacity: .25; }
  .proc-empty { display: flex; align-items: center; gap: 8px; justify-content: center; color: var(--text-faint); font-size: 12px; padding: 30px 0; }
  .proc-foot { display: flex; align-items: center; gap: 10px; padding: 6px 14px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); flex: none; }
  .proc-kill-preview { background: var(--bg0); border: 1px solid color-mix(in oklab, var(--danger) 35%, var(--border)); border-radius: 8px; padding: 9px 11px; font-family: var(--mono); font-size: 11px; line-height: 1.55; color: var(--danger); white-space: pre-wrap; word-break: break-word; margin: 0; }
  .proc-arm { display: flex; flex-direction: column; gap: 6px; font-size: 11.5px; color: var(--text-dim); }
  .proc-arm code { font-family: var(--mono); color: var(--danger); }
  .proc-kill-sel { font-size: 11.5px; padding: 4px 11px; }
  /* ---------- Entra ID auth ---------- */
  .auth-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
  .auth-card { display: flex; align-items: center; gap: 9px; padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg1); cursor: pointer; text-align: left; transition: border-color .12s, background .12s; }
  .auth-card:hover { border-color: var(--text-faint); }
  .auth-card.active { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 7%, var(--bg1)); }
  .auth-card-ic { width: 28px; height: 28px; border-radius: 7px; background: var(--bg2); display: flex; align-items: center; justify-content: center; flex: none; color: var(--text-dim); }
  .auth-card.active .auth-card-ic { color: var(--accent); }
  .auth-card-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .auth-card-name { font-size: 12px; font-weight: 600; color: var(--text); white-space: nowrap; }
  .auth-card-sub { font-size: 10px; color: var(--text-faint); white-space: nowrap; }
  .entra-signin { display: flex; flex-direction: column; gap: 6px; }
  .entra-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg0); color: var(--text); font-size: 12.5px; font-weight: 600; cursor: pointer; transition: border-color .12s, background .12s; }
  .entra-btn:hover:not(:disabled) { border-color: #00a4ef; background: color-mix(in oklab, #00a4ef 7%, var(--bg0)); }
  .entra-btn.busy { color: var(--text-dim); cursor: progress; }
  .entra-hint { font-size: 10.5px; color: var(--text-faint); line-height: 1.45; }
  .entra-account { display: flex; align-items: center; gap: 9px; padding: 7px 10px; border: 1px solid color-mix(in oklab, var(--accent) 40%, var(--border)); background: color-mix(in oklab, var(--accent) 6%, var(--bg0)); border-radius: 8px; }
  .entra-avatar { width: 28px; height: 28px; border-radius: 50%; background: #00a4ef; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; flex: none; }
  .entra-account-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
  .entra-account-name { font-size: 12px; font-weight: 600; }
  .entra-account-upn { font-size: 10px; color: var(--text-faint); font-family: var(--mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entra-signout { border: none; background: none; color: var(--text-faint); font-size: 11px; cursor: pointer; flex: none; }
  .entra-signout:hover { color: var(--danger); }

  /* ---------- misc ---------- */
  .empty-state {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; color: var(--text-dim);
  }
  .empty-state p { font-size: 14px; font-weight: 600; }
  .empty-state span { font-size: 12px; color: var(--text-faint); }
  .toasts {
    position: fixed; bottom: 40px; right: 16px; z-index: 80;
    display: flex; flex-direction: column; gap: 8px; align-items: flex-end;
  }
  .toast {
    display: flex; align-items: center; gap: 8px; padding: 9px 14px;
    background: var(--bg3); border: 1px solid var(--border); border-radius: 10px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text);
    box-shadow: 0 10px 28px rgba(0,0,0,.4); max-width: 480px;
    animation: toast-in .18s ease-out;
  }
  .toast-ok .msym { color: var(--accent); }
  .toast-err .msym { color: #e06c75; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  /* ================= v2: app frame + workspace rail ================= */
  .app-frame { height: 100%; display: flex; flex-direction: column; }
  .app-main { flex: 1; min-height: 0; display: flex; }
  .app-body { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  /* ---------- custom window title bar ---------- */
  .titlebar {
    height: 36px; flex: none; display: flex; align-items: stretch;
    background: linear-gradient(var(--bg1), color-mix(in oklab, var(--bg1) 78%, var(--bg0)));
    border-bottom: 1px solid var(--border); position: relative; z-index: 60;
    -webkit-app-region: drag; user-select: none;
  }
  .titlebar button, .titlebar .tb-menubar { -webkit-app-region: no-drag; }
  .tb-left { display: flex; align-items: center; gap: 4px; padding-left: 12px; flex: none; }
  .tb-brand { display: flex; align-items: center; gap: 8px; padding-right: 6px; }
  .tb-word { font-size: 12.5px; font-weight: 600; letter-spacing: -.01em; color: var(--text); }
  .tb-word-accent { color: var(--accent); }
  .tb-center { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .tb-right { display: flex; align-items: stretch; flex: none; }
  .tb-side-left .tb-left { order: 2; }
  .tb-side-left .tb-center { order: 3; }

  /* menu bar */
  .tb-menubar { display: flex; align-items: center; height: 100%; }
  .tb-menu { position: relative; height: 100%; display: flex; align-items: center; }
  .tb-menu-btn {
    height: 24px; padding: 0 9px; border-radius: 6px; font-size: 12px; color: var(--text-dim);
    display: inline-flex; align-items: center; transition: background .1s, color .1s;
  }
  .tb-menu-btn:hover, .tb-menu-btn.open { background: var(--bg3); color: var(--text); }
  .tb-menu-pop {
    position: absolute; top: 32px; left: 0; z-index: 80; min-width: 208px;
    background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 14px 40px rgba(0,0,0,.5), 0 2px 8px rgba(0,0,0,.3);
    padding: 5px; display: flex; flex-direction: column;
    animation: tb-menu-in .1s ease; -webkit-app-region: no-drag;
  }
  @keyframes tb-menu-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .tb-menu-parent { position: relative; cursor: pointer; }
  .tb-menu-parent.hot { background: var(--bg3); color: var(--text); }
  .tb-menu-caret { color: var(--text-faint); flex: none; }
  .tb-menu-sub { top: -5px; left: calc(100% + 4px); min-width: 232px; z-index: 90; }
  .tb-menu-sub .tb-menu-item span { white-space: nowrap; }
  .tb-menu-item {
    text-align: left; padding: 6px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text-dim);
    transition: background .1s, color .1s; width: 100%; display: flex; align-items: center; gap: 14px; justify-content: space-between;
  }
  .tb-menu-item:hover { background: color-mix(in oklab, var(--accent) 18%, transparent); color: var(--text); }
  .tb-menu-item.disabled { color: var(--text-faint); opacity: .5; cursor: default; }
  .tb-menu-item.disabled:hover { background: none; color: var(--text-faint); }
  .tb-menu-hint-key { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); }
  .tb-menu-sep { height: 1px; background: var(--border); margin: 5px 8px; }

  /* workspace context (center) */
  .tb-context { display: flex; align-items: center; gap: 9px; max-width: 100%; padding: 0 12px; }
  .tb-ws-name { font-size: 12.5px; font-weight: 500; color: var(--text); font-family: var(--mono); white-space: nowrap; }
  .tb-env {
    font-family: var(--mono); font-size: 9px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .06em; padding: 1px 6px; border-radius: 99px; border: 1px solid;
  }
  .tb-detail { font-size: 11px; color: var(--text-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
  .tb-context-empty { font-size: 11.5px; color: var(--text-faint); letter-spacing: .01em; }

  /* window controls */
  .tb-winctl { display: flex; align-items: stretch; }
  .tb-winctl-left { margin-right: 8px; }
  .tb-wc {
    width: 46px; display: inline-flex; align-items: center; justify-content: center;
    color: var(--text-dim); transition: background .1s, color .1s;
  }
  .tb-wc:hover { background: var(--bg3); color: var(--text); }
  .tb-wc-close:hover { background: #e0483f; color: #fff; }
  /* macOS traffic-light variant */
  .tb-winctl-left { padding: 0 8px 0 10px; gap: 8px; align-items: center; margin-right: 6px; }
  .tb-winctl-left .tb-wc {
    width: 12px; height: 12px; border-radius: 50%; color: transparent; padding: 0;
    border: 1px solid rgba(0,0,0,.22);
  }
  .tb-winctl-left .tb-wc-close { background: #ff5f57; }
  .tb-winctl-left .tb-wc-min { background: #febc2e; }
  .tb-winctl-left .tb-wc-max { background: #28c840; }
  /* macOS shows glyphs on ALL three only when the group is hovered */
  .tb-winctl-left:hover .tb-wc { color: rgba(0,0,0,.62); }
  .tb-winctl-left .tb-wc:hover { background: none; }
  .tb-winctl-left .tb-wc-close { background: #ff5f57 !important; }
  .tb-winctl-left .tb-wc-min { background: #febc2e !important; }
  .tb-winctl-left .tb-wc-max { background: #28c840 !important; }
  .tb-winctl-left .tb-wc svg { width: 7px; height: 7px; stroke-width: 1.5; }
  .tb-menu-hint { font-size: 10.5px; color: var(--text-faint); margin-left: 8px; opacity: .8; letter-spacing: .01em; }
  .tb-side-left .tb-right { display: none; }
  .rail {
    width: 56px; flex: none; background: var(--bg1); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 8px;
    position: relative; z-index: 30;
  }
  .rail-logo { padding: 4px 0 2px; }
  .logo-cursor { animation: logo-blink 1.2s steps(2, start) infinite; }
  @keyframes logo-blink { 50% { opacity: 0.15; } }
  .rail-sep { width: 28px; height: 1px; background: var(--border); }
  .rail-list { display: flex; flex-direction: column; gap: 8px; align-items: center; overflow-y: auto; scrollbar-width: none; }
  .rail-list::-webkit-scrollbar { display: none; }
  .ws-tile {
    width: 40px; height: 40px; border-radius: 11px; position: relative;
    background: color-mix(in oklab, var(--ws-color) 16%, var(--bg2));
    border: 1px solid color-mix(in oklab, var(--ws-color) 35%, transparent);
    color: var(--ws-color); font-weight: 600; font-size: 13px;
    display: flex; align-items: center; justify-content: center;
    transition: transform .1s, border-color .12s, box-shadow .12s; flex: none;
  }
  .ws-tile:hover { transform: translateY(-1px); }
  .ws-tile.active {
    border-color: var(--ws-color);
    box-shadow: 0 0 0 1px var(--ws-color), 0 4px 14px color-mix(in oklab, var(--ws-color) 30%, transparent);
  }
  .ws-tile.active::before {
    content: ''; position: absolute; left: -9px; top: 50%; transform: translateY(-50%);
    width: 3px; height: 22px; border-radius: 2px; background: var(--ws-color);
  }
  .ws-tile-initials { letter-spacing: .02em; }
  .ws-tile-wrap { position: relative; flex: none; display: flex; }
  .ws-tile-opts {
    position: absolute; top: -4px; right: -4px; z-index: 4;
    width: 18px; height: 18px; border-radius: 50%; padding: 0;
    display: flex; align-items: center; justify-content: center;
    background: var(--bg3); color: var(--text-dim); border: 1px solid var(--border);
    opacity: 0; transform: scale(.8); transition: opacity .12s, transform .12s, color .12s;
  }
  .ws-tile-wrap:hover .ws-tile-opts, .ws-tile.menu-open + .ws-tile-opts { opacity: 1; transform: scale(1); }
  .ws-tile-opts:hover { color: var(--text); border-color: var(--accent); }
  .ws-tile-engine {
    position: absolute; right: -4px; bottom: -4px;
    font-family: var(--mono); font-size: 7.5px; font-weight: 600;
    background: var(--bg3); color: var(--text-dim); border: 1px solid var(--border);
    border-radius: 5px; padding: 1px 3px;
  }
  .ws-add {
    width: 40px; height: 40px; border-radius: 11px; flex: none;
    border: 1px dashed var(--border); color: var(--text-faint);
    display: flex; align-items: center; justify-content: center;
    transition: color .12s, border-color .12s;
  }
  .ws-add:hover, .ws-add.active { color: var(--accent); border-color: var(--accent); }
  .rail-donate {
    width: 38px; height: 38px; border-radius: 50%; flex: none;
    color: #c98a5a; background: #c98a5a18;
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, transform .12s;
  }
  .rail-donate:hover { background: #c98a5a2e; transform: scale(1.08); }
  .rail-version { font-family: var(--mono); font-size: 9px; color: var(--text-faint); padding: 4px 2px 2px; letter-spacing: .02em; transition: color .12s; }
  .rail-version:hover { color: var(--accent); }
  .rail-settings {
    width: 38px; height: 38px; border-radius: 11px; flex: none; margin-bottom: 8px;
    color: var(--text-faint); display: flex; align-items: center; justify-content: center;
    transition: color .15s, background .15s, transform .15s;
  }
  .rail-settings:hover { color: var(--text); background: var(--bg3); }
  .rail-settings:hover .msym { transform: rotate(40deg); transition: transform .3s ease; }
  .rail-settings .msym { transition: transform .3s ease; }
  .rail-bug {
    width: 38px; height: 38px; border-radius: 11px; flex: none; margin-bottom: 8px;
    color: var(--text-faint); display: flex; align-items: center; justify-content: center;
    background: none; border: none; cursor: pointer; transition: color .15s, background .15s;
  }
  .rail-bug:hover { color: #e06c75; background: color-mix(in oklab, #e06c75 14%, transparent); }

  /* ============ settings modal ============ */
  .set-modal { width: 760px; max-width: calc(100vw - 40px); padding: 0; gap: 0; overflow: hidden; display: flex; flex-direction: column; max-height: calc(100vh - 48px); }
  .set-head { display: flex; align-items: center; gap: 9px; padding: 15px 18px; border-bottom: 1px solid var(--border); flex: none; }
  .set-body { display: flex; min-height: 0; flex: 1; }
  .set-nav { width: 176px; flex: none; border-right: 1px solid var(--border); padding: 12px 10px; display: flex; flex-direction: column; gap: 2px; background: var(--bg1); }
  .set-nav-item { display: flex; align-items: center; gap: 9px; padding: 8px 11px; border-radius: 8px; font-size: 12.5px; color: var(--text-dim); text-align: left; transition: background .12s, color .12s; }
  .set-nav-item:hover { background: var(--bg2); color: var(--text); }
  .set-nav-item.active { background: color-mix(in oklab, var(--accent) 14%, var(--bg2)); color: var(--text); }
  .set-nav-item.active .msym { color: var(--accent); }
  .set-nav-reset { display: flex; align-items: center; gap: 6px; padding: 8px 11px; border-radius: 8px; font-size: 11.5px; color: var(--text-faint); text-align: left; }
  .set-nav-reset:hover { color: var(--danger); background: color-mix(in oklab, var(--danger) 12%, transparent); }
  .set-pane { flex: 1; min-width: 0; overflow-y: auto; overflow-x: hidden; padding: 18px 22px 24px; background: var(--bg0); }
  .set-section-label { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-faint); margin: 4px 0 11px; }
  .set-section-label:not(:first-child) { margin-top: 24px; }

  .set-row { display: flex; align-items: center; gap: 16px; padding: 11px 0; border-top: 1px solid var(--border); }
  .set-row:first-of-type { border-top: none; }
  .set-row-label { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .set-row-label > span:first-child { font-size: 13px; color: var(--text); }
  .set-row-hint { font-size: 11px; color: var(--text-faint); line-height: 1.4; }
  .set-row-control { flex: none; }

  /* theme swatches */

  /* ================= v2: editor saved queries ================= */

  .drawer-scrim.show { opacity: 1; pointer-events: auto; }
  .sq-drawer { position: absolute; top: 0; right: 0; bottom: 0; width: 360px; max-width: 84%; background: var(--bg1); border-left: 1px solid var(--border); box-shadow: -16px 0 44px rgba(0,0,0,.4); transform: translateX(100%); transition: transform .22s cubic-bezier(.4,.1,.2,1); z-index: 46; display: flex; flex-direction: column; }
  .sq-drawer.open { transform: translateX(0); }

  .sq-drawer-sub { padding: 0 14px 10px; font-size: 11px; color: var(--text-faint); }
  .sq-search { display: flex; align-items: center; gap: 7px; margin: 0 12px 10px; background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 0 6px 0 9px; }

  .sq-list { flex: 1; overflow-y: auto; padding: 0 10px 12px; display: flex; flex-direction: column; gap: 7px; }
  .sq-empty { padding: 24px 12px; text-align: center; font-size: 12.5px; color: var(--text-faint); line-height: 1.5; }
  .sq-item { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 9px 11px; cursor: pointer; transition: border-color .12s; }
  .sq-item:hover { border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .sq-item-head { display: flex; align-items: center; gap: 8px; }

  .sq-item-del { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 5px; color: var(--text-faint); opacity: 0; transition: opacity .1s; flex: none; }
  .sq-item:hover .sq-item-del { opacity: 1; }
  .sq-item-del:hover { color: #e06c75; background: #e06c7518; }
  .sq-item-sql { margin: 7px 0 0; font-family: var(--mono); font-size: 10.5px; line-height: 1.5; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 76px; overflow: hidden; }
  .save-pop {
    width: 250px; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 14px 36px rgba(0,0,0,.45); padding: 10px; display: flex; flex-direction: column; gap: 8px;
  }

  }

  }

  /* ================= v2: structure DDL ================= */

  }

    overflow-x: auto; white-space: pre;
  }

  /* ================= grouped object browser (sidebar) ================= */
  .sidebar-objects { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0; }

  .sidebar-other { flex: 0 1 auto; min-height: 0; max-height: 52%; overflow-y: auto; padding: 4px 6px 6px; border-top: 1px solid var(--border); background: color-mix(in oklab, var(--bg0) 45%, transparent); }
  .obj-section { margin-bottom: 2px; }
  .obj-section-acc.open { background: color-mix(in oklab, var(--bg2) 55%, transparent); border-radius: 8px; }
  .obj-sec-body-scroll { max-height: 40vh; overflow-y: auto; }
  .obj-sec-head {
    display: flex; align-items: center; gap: 7px; padding: 6px 8px 5px 4px;
    cursor: pointer; user-select: none; border-radius: 6px;
    font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .09em;
    color: var(--text-faint); position: sticky; top: 0; background: var(--bg1); z-index: 1;
  }
  .obj-sec-head:hover { color: var(--text-dim); }
