  .obj-sec-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obj-sec-count { font-family: var(--mono); font-weight: 600; letter-spacing: 0; color: var(--text-faint); }
  .sec-new-btn { display: inline-flex; align-items: center; justify-content: center; width: 19px; height: 19px; border-radius: 5px; color: var(--text-faint); flex: none; opacity: 0; transition: opacity .12s; }
  .obj-sec-head:hover .sec-new-btn { opacity: 1; }
  .sec-new-btn:hover { color: var(--accent); background: var(--bg3); }
  .obj-sec-body { padding-bottom: 4px; }
  .obj-item {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px;
    cursor: pointer; transition: background .1s; user-select: none;
  }
  .obj-item:hover { background: var(--bg2); }
  .obj-item.active { background: color-mix(in oklab, var(--accent) 13%, transparent); }
  .obj-item-name { font-family: var(--mono); font-size: 12px; color: var(--text-dim); flex: none; max-width: 60%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .obj-item.active .obj-item-name { color: var(--text); }
  .obj-item-hint { flex: 1; min-width: 0; font-family: var(--mono); font-size: 10px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
  .obj-item-def { margin-left: auto; flex: none; background: none; border: none; color: var(--text-faint); cursor: pointer; display: flex; padding: 2px; border-radius: 5px; opacity: 0; transition: opacity .1s, color .1s; }
  .obj-item:hover .obj-item-def { opacity: 1; }
  .obj-item-def:hover { color: var(--accent); background: var(--bg3); }

  /* ================= object viewer (view / matview / function / procedure / trigger) ================= */
  .obj-view { flex: 1; min-height: 0; overflow-y: auto; padding: 20px 22px 28px; display: flex; flex-direction: column; gap: 16px; }
  .obj-head { display: flex; align-items: flex-start; gap: 13px; }
  .obj-head-icon { flex: none; width: 40px; height: 40px; border-radius: 11px; display: flex; align-items: center; justify-content: center; }
  .obj-head-main { flex: 1; min-width: 0; }
  .obj-head-title { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .obj-head-name { font-family: var(--mono); font-size: 17px; font-weight: 600; color: var(--text); }
  .obj-type-badge { font-size: 9.5px; font-weight: 700; letter-spacing: .06em; padding: 2px 7px; border-radius: 5px; border: 1px solid var(--border); background: var(--bg1); }
  .obj-type-badge.obj-disabled { color: var(--text-faint); }
  .obj-head-comment { margin-top: 4px; font-size: 12.5px; color: var(--text-dim); line-height: 1.5; }
  .obj-head-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  .obj-drop-btn:hover { color: var(--danger, #e5616b) !important; background: color-mix(in oklab, var(--danger, #e5616b) 14%, transparent) !important; }
  .obj-drop-confirm { position: absolute; top: calc(100% + 6px); right: 0; z-index: 30; width: 300px; padding: 13px; background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 12px 32px rgba(0,0,0,.42); text-align: left; }
  .obj-drop-confirm-msg { font-size: 12.5px; color: var(--text); line-height: 1.5; }
  .obj-drop-confirm-msg b { font-family: var(--mono); }
  .obj-drop-confirm-sql { margin: 9px 0 11px; padding: 7px 9px; background: var(--bg0); border: 1px solid var(--border); border-radius: 6px; font-family: var(--mono); font-size: 11px; color: var(--text-dim); white-space: pre-wrap; word-break: break-all; }
  .obj-drop-confirm-actions { display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
  .obj-drop-confirm-go { background: var(--danger, #e5616b) !important; border-color: var(--danger, #e5616b) !important; }
  .obj-chiprow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .obj-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; background: var(--bg1); border: 1px solid var(--border); border-radius: 7px; font-size: 11px; }
  .obj-chip-k { color: var(--text-faint); text-transform: uppercase; letter-spacing: .05em; font-size: 9.5px; font-weight: 600; }
  .obj-chip-v { font-family: var(--mono); color: var(--text); }
  .obj-args { background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .obj-args-title { padding: 9px 13px; font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: .07em; border-bottom: 1px solid var(--border); }
  .obj-args-table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .obj-args-table th { text-align: left; padding: 7px 13px; font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--text-faint); }
  .obj-args-table td { padding: 7px 13px; border-top: 1px solid var(--border); font-family: var(--mono); color: var(--text-dim); }
  .obj-args-i { color: var(--text-faint); width: 28px; }
  .obj-args-name { color: var(--text); }
  .obj-args-type { color: var(--accent); }
  .obj-ddl-wrap { display: flex; flex-direction: column; gap: 8px; }
  .obj-ddl-label { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); }
  .obj-ddl-label .mi { color: var(--text-faint); }
  .obj-ddl-dialect { margin-left: auto; text-transform: none; letter-spacing: 0; font-weight: 500; color: var(--text-faint); font-family: var(--mono); }
  .obj-ddl-block { margin: 0; }

  /* ================= v2: schema map ================= */
  .schema-map { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .map-toolbar {
    display: flex; align-items: center; gap: 9px; padding: 8px 14px;
    border-bottom: 1px solid var(--border); flex: none;
  }
  .map-title { font-family: var(--mono); font-size: 12.5px; font-weight: 600; }
  .map-sub, .map-hint { font-size: 11px; color: var(--text-faint); }
  .map-zoom { font-family: var(--mono); font-size: 11px; color: var(--text-dim); width: 38px; text-align: center; }
  .map-canvas-wrap {
    flex: 1; overflow: auto; min-height: 0;
    background-image: radial-gradient(color-mix(in oklab, var(--border) 70%, transparent) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  .map-canvas { position: relative; }
  .map-inner { position: relative; transform-origin: 0 0; }
  .map-edges { position: absolute; inset: 0; pointer-events: none; }
  .map-edge-path { fill: none; stroke: color-mix(in oklab, var(--accent) 55%, var(--border)); stroke-width: 1.5; }
  .map-edge-dot { fill: var(--accent); }
  .map-edge-arrow { fill: color-mix(in oklab, var(--accent) 25%, var(--bg0)); stroke: var(--accent); stroke-width: 1; }
  .map-card {
    position: absolute; background: var(--bg1); border: 1px solid var(--border);
    border-radius: 11px; box-shadow: 0 8px 26px rgba(0,0,0,.35); overflow: hidden;
  }
  .map-card:hover { border-color: color-mix(in oklab, var(--accent) 45%, var(--border)); }
  .map-card-head {
    display: flex; align-items: center; gap: 7px; padding: 0 10px; height: 36px;
    background: var(--bg2); border-bottom: 1px solid var(--border); cursor: grab; user-select: none;
  }
  .map-card-head:active { cursor: grabbing; }
  .map-card-name { font-family: var(--mono); font-size: 12px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-card-count { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .map-card-open {
    display: inline-flex; align-items: center; justify-content: center;
    width: 20px; height: 20px; border-radius: 5px; color: var(--text-faint); flex: none;
  }
  .map-card-open:hover { color: var(--accent); background: var(--bg3); }
  .map-card-cols { padding: 4px 0; }
  .map-card-col { display: flex; align-items: center; gap: 6px; padding: 0 10px; }
  .map-col-icon { width: 13px; display: inline-flex; flex: none; }
  .map-col-name { font-family: var(--mono); font-size: 11px; color: var(--text-dim); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .map-col-name.is-fk { color: var(--text); }
  .map-col-type { font-family: var(--mono); font-size: 9px; color: var(--text-faint); }

  /* ---- schema-map EDIT mode ---- */
  .map-edit-toggle { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); padding: 5px 10px; border-radius: 7px; border: 1px solid var(--border); }
  .map-edit-toggle:hover { color: var(--text); background: var(--bg2); }
  .map-edit-toggle.on { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .map-addtable { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--accent); padding: 5px 10px; border-radius: 7px; border: 1px solid color-mix(in oklab, var(--accent) 40%, transparent); }
  .map-addtable:hover { background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .map-edit-input { font-family: var(--mono); font-size: 11px; background: var(--bg0); border: 1px solid var(--accent); border-radius: 4px; color: var(--text); padding: 1px 4px; outline: none; min-width: 0; width: 100%; }
  .schema-map.is-editing .map-card-name { cursor: text; }
  .map-card-act { display: inline-flex; padding: 3px; border-radius: 5px; color: var(--text-faint); }
  .map-card-act:hover { color: var(--accent); background: var(--bg3); }
  .map-card-act.danger:hover { color: var(--danger); }
  .map-card-col.editable { display: grid; grid-template-columns: 13px minmax(0, 92px) 1fr 32px 16px 9px; gap: 6px; padding: 0 10px; position: relative; }
  .map-card-col.editable:hover { background: var(--bg2); }
  .map-card-col.editable .map-col-name,
  .map-card-col.editable .map-edit-input { flex: none; width: auto; min-width: 0; }
  .map-card-col.editable .filter-select.map-type-sel { width: 100%; max-width: none; min-width: 0; flex: none; }
  .map-card-col.editable .map-null-btn { display: inline-flex; align-items: center; width: 100%; justify-content: center; text-align: center; padding: 1px 0; box-sizing: border-box; }
  .map-col-drop.armed, .map-card-act.danger.armed { color: #fff; background: var(--danger); }
  .map-col-drop.armed:hover, .map-card-act.danger.armed:hover { background: var(--danger); }
  .map-pk-btn { display: inline-flex; padding: 1px; border-radius: 4px; color: var(--text-faint); }
  .map-pk-btn.on { color: var(--accent); }
  .map-pk-btn:hover { color: var(--accent); background: var(--bg3); }
  .map-type-sel { font-size: 9.5px; padding: 1px 4px; max-width: 86px; border-radius: 5px; }
  .map-null-btn { font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .03em; color: var(--text-faint); border: 1px solid var(--border); border-radius: 4px; padding: 1px 3px; flex: none; }
  .map-null-btn.notnull { color: #e2b340; border-color: color-mix(in oklab, #e2b340 45%, transparent); }
  .map-null-btn:disabled { opacity: .35; cursor: default; }
  .map-col-drop { display: inline-flex; padding: 1px; border-radius: 4px; color: var(--text-faint); flex: none; }
  .map-col-drop:hover { color: var(--danger); background: var(--bg3); }
  .map-fk-port { width: 9px; height: 9px; border-radius: 50%; background: var(--bg3); border: 2px solid var(--text-faint); flex: none; cursor: crosshair; margin-right: -2px; }
  .map-fk-port:hover { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }
  .map-edge-path.pending { stroke-dasharray: 4 4; opacity: .9; }
  .map-fk-del { display: flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; background: var(--bg2); border: 1px solid var(--border); color: var(--text-faint); }
  .map-fk-del:hover { color: var(--danger); border-color: var(--danger); }
  .map-edge-g .map-fk-del { opacity: 0; transition: opacity .12s; }
  .map-edge-g:hover .map-fk-del { opacity: 1; }
  .map-pending { position: absolute; left: 14px; right: 14px; bottom: 14px; background: var(--bg1); border: 1px solid var(--border); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 6; }
  .pending-sql.destructive { border-left: 2px solid #e06c75; }

  /* schema commit modal */
  .commit-modal { width: 580px; max-width: calc(100vw - 40px); }
  .commit-body { padding: 4px 4px 0; font-size: 13px; color: var(--text-dim); line-height: 1.55; }
  .commit-body code { font-family: var(--mono); color: var(--text); background: var(--bg0); padding: 1px 5px; border-radius: 4px; }
  .commit-sql-list { margin: 12px 0; max-height: 240px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
  .commit-sql-row { display: flex; gap: 8px; align-items: flex-start; background: var(--bg0); border: 1px solid var(--border); border-radius: 7px; padding: 7px 9px; }
  .commit-sql-row.destructive { border-color: color-mix(in oklab, #e06c75 40%, var(--border)); }
  .commit-sql-row .msym { margin-top: 1px; flex: none; }
  .commit-sql-row pre { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; white-space: pre-wrap; margin: 0; flex: 1; }
  .commit-warn { display: flex; gap: 8px; align-items: flex-start; font-size: 12px; color: #e06c75; background: color-mix(in oklab, #e06c75 10%, transparent); border: 1px solid color-mix(in oklab, #e06c75 30%, transparent); border-radius: 8px; padding: 9px 11px; margin-bottom: 12px; }
  .commit-warn .msym { flex: none; margin-top: 1px; }
  .commit-prod { background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 11px 12px; margin-bottom: 4px; }
  .commit-prod-tag { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 9.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; border: 1px solid; border-radius: 99px; padding: 2px 8px; margin-bottom: 9px; }
  .commit-prod label { display: block; font-size: 12px; color: var(--text-dim); }
  .commit-prod input { display: block; width: 100%; margin-top: 6px; font-family: var(--mono); font-size: 12.5px; background: var(--bg1); border: 1px solid var(--border); border-radius: 6px; color: var(--text); padding: 7px 9px; outline: none; }
  .commit-prod input:focus { border-color: var(--accent); }

  /* ================= Schema Diff & Sync (sd-) ================= */
  .sd-app { flex: 1; min-height: 0; display: flex; flex-direction: column; background: var(--bg0); position: relative; }
  /* compare-only mode (from the connection screen) */
  .sd-compare .sd-pane-diff { border-right: none; }

  .bug-preview { background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-family: var(--mono); font-size: 10.5px; line-height: 1.5; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; max-height: 200px; overflow-y: auto; margin: 0; }
  .bug-foot { display: flex; gap: 8px; align-items: center; }
  .bug-linkbtn { display: inline-flex; align-items: center; gap: 5px; border: none; background: none; color: var(--text-faint); font-size: 11px; cursor: pointer; padding: 4px 2px; }
  .bug-linkbtn:hover { color: var(--text); }
  .bug-hint { font-size: 10.5px; color: var(--text-faint); text-align: right; margin-top: -4px; }
  /* ================= v2: stackable filter builder ================= */
  .filter-toggle {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
    color: var(--text-dim); border: 1px solid var(--border); background: var(--bg1);
    transition: color .1s, border-color .12s; flex: none;
  }
  .filter-toggle:hover { color: var(--text); }
  .filter-toggle.open { color: var(--accent); border-color: color-mix(in oklab, var(--accent) 50%, var(--border)); }
  .filter-toggle.has-applied { color: var(--accent); }
  .filter-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .applied-where {
    font-family: var(--mono); font-size: 11px; color: var(--text-dim);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 40%; padding-right: 4px;
  }
  .applied-where.empty { color: var(--text-faint); font-style: italic; padding-right: 6px; }
  .filter-panel {
    border-bottom: 1px solid var(--border); background: var(--bg1);
    padding: 9px 12px 8px; flex: none; display: flex; flex-direction: column; gap: 7px;
  }
  .filter-panel.hidden { display: none; }
  .filter-rows { display: flex; flex-direction: column; gap: 6px; }
  .filter-row { display: flex; align-items: center; gap: 8px; }
  .filter-row.disabled .filter-select,
  .filter-row.disabled .filter-value,
  .filter-row.disabled .filter-and { opacity: .45; }
  .filter-and {
    font-family: var(--mono); font-size: 10px; font-weight: 600; color: var(--accent);
    width: 44px; text-align: right; flex: none; letter-spacing: .04em;
  }
  .filter-check { display: inline-flex; cursor: pointer; flex: none; }
  .filter-check input { position: absolute; opacity: 0; pointer-events: none; }
  .filter-checkbox {
    width: 16px; height: 16px; border-radius: 5px; border: 1.5px solid var(--text-faint);
    display: inline-flex; align-items: center; justify-content: center;
    color: var(--on-accent); transition: background .12s, border-color .12s;
  }
  .filter-checkbox.on { background: var(--accent); border-color: var(--accent); }
  .filter-select {
    background: var(--bg0); border: 1px solid var(--border); border-radius: 7px;
    font-family: var(--mono); font-size: 11.5px; padding: 5px 7px; outline: none;
    color: var(--text); max-width: 170px;
  }
  .filter-select:focus { border-color: var(--accent); }
  .filter-op { max-width: 130px; }
  .filter-value {
    flex: 1; min-width: 60px; background: var(--bg0); border: 1px solid var(--border);
    border-radius: 7px; font-family: var(--mono); font-size: 11.5px; padding: 5px 9px;
    outline: none; color: var(--text); transition: border-color .12s;
  }
  .filter-value:focus { border-color: var(--accent); }
  .filter-novalue { flex: 1; }
  .filter-raw-row { display: flex; align-items: center; gap: 8px; }
  .filter-foot { display: flex; align-items: center; gap: 10px; }
  .filter-add, .filter-rawtoggle {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11.5px; color: var(--text-dim); padding: 4px 8px; border-radius: 6px;
  }
  .filter-add:hover { color: var(--accent); background: var(--bg2); }
  .filter-rawtoggle:hover { color: var(--text); background: var(--bg2); }
  .filter-rawtoggle.on { color: var(--accent); background: color-mix(in oklab, var(--accent) 12%, transparent); }
  .filter-sqlpeek { display: flex; align-items: stretch; gap: 8px; margin-top: 10px; padding: 9px 10px; background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; position: relative; }
  .filter-sqlpeek-label { font-size: 8.5px; font-weight: 600; letter-spacing: .07em; color: var(--text-faint); position: absolute; top: -6px; left: 10px; background: var(--bg1); padding: 0 5px; }
  .filter-sqlpeek-code { flex: 1; margin: 0; font-family: var(--mono); font-size: 11.5px; line-height: 1.5; color: var(--text); white-space: pre-wrap; word-break: break-word; }
  .filter-sqlpeek-copy { flex: none; align-self: flex-start; display: inline-flex; align-items: center; justify-content: center; width: 26px; height: 26px; border: none; background: none; border-radius: 6px; color: var(--text-faint); cursor: pointer; }
  .filter-sqlpeek-copy:hover { background: var(--bg2); color: var(--accent); }
  .filter-orderlimit { display: inline-flex; align-items: center; gap: 5px; }
  .filter-ol-col, .filter-ol-limit { font-size: 11px !important; padding: 3px 6px !important; }
  .filter-ol-dir { font-size: 10px; font-family: var(--mono); font-weight: 600; color: var(--text-dim); background: var(--bg2); border: 1px solid var(--border); border-radius: 5px; padding: 3px 7px; cursor: pointer; }
  .filter-ol-dir:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .filter-ol-dir:disabled { opacity: .4; cursor: default; }
  .filter-count-note { font-size: 10.5px; color: var(--text-faint); font-family: var(--mono); }
  .filter-err-inline {
    display: inline-flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 11px; color: #e06c75;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 50%;
  }

  /* ================= Redis ================= */
  .rtype-badge {
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 6px; font-family: var(--mono); font-weight: 600; flex: none; letter-spacing: -.02em;
  }
  .match-label { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--accent); padding-left: 3px; }
  .rdb-keycount { font-family: var(--mono); font-size: 10px; color: var(--text-faint); margin-left: auto; padding-right: 4px; }
  .rdb-pop { max-height: 320px; overflow-y: auto; }
  .schema-pop-item.empty { opacity: .4; }
  .rtype-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 0 10px 8px; }
  .rtype-chip {
    font-family: var(--mono); font-size: 10px; color: var(--text-dim);
    background: var(--bg1); border: 1px solid var(--border); border-radius: 99px; padding: 2px 9px;
    transition: color .1s, border-color .1s;
  }
  .rtype-chip:hover { color: var(--text); }
  .rtype-chip.active { background: color-mix(in oklab, var(--accent) 14%, var(--bg2)); color: var(--accent); border-color: color-mix(in oklab, var(--accent) 45%, transparent); }
  .rview-toggle { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 5px; color: var(--text-faint); }
  .rview-toggle:hover { color: var(--accent); background: var(--bg2); }
  .rkey-list { padding: 0 6px 8px; }
  .rkey-item { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: pointer; transition: background .1s; }
  .rkey-item:hover { background: var(--bg2); }
  .rkey-item.active { background: color-mix(in oklab, var(--accent) 12%, var(--bg2)); }
  .rkey-name { flex: 1; font-family: var(--mono); font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rkey-item.active .rkey-name { color: var(--text); }
  .rkey-ttl { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); padding: 1px 5px; border-radius: 4px; border: 1px solid transparent; }
  .rkey-ttl.live { color: var(--accent); background: color-mix(in oklab, var(--accent) 10%, transparent); }
  .rns-row { display: flex; align-items: center; gap: 5px; padding: 4px 8px; border-radius: 6px; cursor: pointer; user-select: none; }
  .rns-row:hover { background: var(--bg2); }
  .rns-name { flex: 1; font-family: var(--mono); font-size: 11.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rns-count { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); }

  .rkey-tab-name { font-family: var(--mono); font-size: 12px; color: var(--text); background: var(--bg1); border: 1px solid var(--border); border-radius: 6px; padding: 3px 9px; }

  /* string viewer */
  .rstr { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .rstr-bar { display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-bottom: 1px solid var(--border); }
  .rstr-meta { font-family: var(--mono); font-size: 11px; color: var(--text-faint); }
  .rstr-value { flex: 1; overflow: auto; margin: 0; padding: 14px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  .rstr-edit { flex: 1; margin: 0; padding: 14px 16px; background: var(--bg0); border: none; outline: none; resize: none; font-family: var(--mono); font-size: 12.5px; line-height: 1.6; color: var(--text); }

  /* key info */
  .rinfo { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .rinfo-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .rinfo-key { font-family: var(--mono); font-size: 15px; font-weight: 600; color: var(--text); word-break: break-all; }
  .rinfo-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 360px)); gap: 0 28px; max-width: 760px; }
  .rinfo-row { display: flex; justify-content: space-between; gap: 16px; padding: 9px 0; border-bottom: 1px solid color-mix(in oklab, var(--border) 55%, transparent); font-family: var(--mono); font-size: 12.5px; }
  .rinfo-label { color: var(--text-faint); }
  .rinfo-val { color: var(--text); text-align: right; }
  .rinfo-actions { margin-top: 22px; max-width: 760px; }
  .rinfo-actions h3 { display: flex; align-items: center; gap: 7px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim); margin-bottom: 12px; }
  .rinfo-act-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .rinfo-ttl-input { width: 110px; background: var(--bg0); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-family: var(--mono); font-size: 12px; outline: none; color: var(--text); }
  .rinfo-ttl-input:focus { border-color: var(--accent); }

  /* CLI */
  .rcli { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .rcli-toolbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex: none; }
  .rcli-title { font-family: var(--mono); font-size: 12px; font-weight: 600; }
  .rcli-body { flex: 1; overflow-y: auto; padding: 12px 16px; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; background: var(--bg0); cursor: text; }
  .rcli-line { white-space: pre-wrap; word-break: break-word; }
  .cli-prompt { color: var(--text-dim); margin-top: 7px; }
  .cli-status { color: var(--accent); }
  .cli-error { color: #e06c75; }
  .cli-int { color: #7fb8e8; }
  .cli-nil { color: var(--text-faint); }
  .cli-bulk { color: #e5c07b; }
  .cli-idx { color: var(--text-faint); }
  .cli-info { color: var(--text-faint); font-style: italic; }
  .rcli-inputline { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .rcli-prompt { color: var(--accent); flex: none; }
  .rcli-input { flex: 1; background: none; border: none; outline: none; font-family: var(--mono); font-size: 12.5px; color: var(--text); caret-color: var(--accent); }

  /* dashboard */
  .rdash { flex: 1; overflow-y: auto; padding: 20px 24px; }
  .rdash-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .rdash-head h2 { font-size: 16px; font-weight: 600; }
  .rdash-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; }
  .rdash-stat { background: var(--bg1); border: 1px solid var(--border); border-radius: 11px; padding: 13px 15px; }
  .rdash-stat-label { font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--text-faint); }
  .rdash-stat-value { font-family: var(--mono); font-size: 22px; font-weight: 600; color: var(--text); margin-top: 4px; }
  .rdash-stat-sub { font-size: 10.5px; color: var(--text-faint); margin-top: 2px; }
  .rdash-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; max-width: 1000px; }
  .rdash-stat-btn { display: block; width: 100%; text-align: left; cursor: pointer; font-family: var(--ui); transition: border-color .13s, background .13s; }
  .rdash-stat-btn:hover { border-color: var(--accent); background: color-mix(in oklab, var(--accent) 7%, var(--bg1)); }
  .rdash-stat-go { display: flex; align-items: center; gap: 4px; font-size: 10.5px; color: var(--accent); margin-top: 2px; }
  .rdash-cl-row { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .rdash-cl-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .rdash-cl-label { font-size: 11.5px; color: var(--text-dim); width: 66px; flex: none; }
  .rdash-cl-n { font-family: var(--mono); font-size: 11.5px; color: var(--text-dim); width: 26px; text-align: right; flex: none; }
  .rdash-cl-note { display: flex; gap: 7px; align-items: flex-start; font-size: 10.5px; line-height: 1.55; color: var(--text-faint); margin: 11px 0; }
  .rdash-cl-note .m-icon, .rdash-cl-note .msym { flex: none; margin-top: 1px; }

  /* ---------- Redis Cluster ---------- */
  .cl-dash .rdash-head { align-items: center; }
  .cl-state { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; border-radius: 99px; padding: 3px 10px; }
  .cl-state.ok { color: var(--accent); background: color-mix(in oklab, var(--accent) 13%, transparent); border: 1px solid color-mix(in oklab, var(--accent) 32%, transparent); }
  .cl-state.warn { color: var(--warn); background: color-mix(in oklab, var(--warn) 12%, transparent); border: 1px solid color-mix(in oklab, var(--warn) 32%, transparent); }
  .cl-grid { grid-template-columns: repeat(4, 1fr); }
  .cl-stat-bad .rdash-stat-value { color: var(--warn); }
  .cl-bad-n { font-family: var(--ui); font-style: normal; font-size: 10px; color: var(--warn); }

  .cl-map { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px 12px; margin-bottom: 16px; max-width: 1000px; }
  .cl-map-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 11px; flex-wrap: wrap; }
  .cl-map-title { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .09em; color: var(--text-dim); }
  .cl-map-sub { font-size: 10.5px; color: var(--text-faint); }
  .cl-map-hover { font-family: var(--mono); font-size: 10.5px; color: var(--text); }
  .cl-map-hover.dim { color: var(--text-faint); }
  .cl-band { position: relative; display: flex; height: 44px; border-radius: 8px; overflow: hidden; box-shadow: inset 0 0 0 1px var(--border); }
  .cl-seg { position: relative; border: none; cursor: pointer; display: flex; flex-direction: column; justify-content: center; gap: 1px; padding: 0 10px; overflow: hidden; opacity: .82; transition: opacity .13s; text-align: left; }
  .cl-seg:hover, .cl-seg.on { opacity: 1; }
  .cl-seg + .cl-seg { box-shadow: inset 1px 0 0 rgba(0,0,0,.35); }
  .cl-seg-label { font-family: var(--ui); font-size: 11px; font-weight: 600; color: #0d0f12; white-space: nowrap; }
  .cl-seg-range { font-family: var(--mono); font-size: 9.5px; color: rgba(0,0,0,.62); white-space: nowrap; }
  .cl-mig { position: absolute; top: 0; bottom: 0; pointer-events: none; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.42) 0 4px, transparent 4px 8px); box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
  .cl-cursor { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--text); pointer-events: none; }
  .cl-map-legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 9px; }
  .cl-lg { display: inline-flex; align-items: center; gap: 6px; font-size: 10.5px; color: var(--text-faint); }
  .cl-lg i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .cl-lg-mig { background-image: repeating-linear-gradient(45deg, var(--text-faint) 0 2px, transparent 2px 4px); box-shadow: inset 0 0 0 1px var(--border); }

  .cl-shards { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 11px; margin-bottom: 16px; max-width: 1000px; }
  .cl-shard { background: var(--bg1); border: 1px solid var(--border); border-radius: 12px; padding: 12px 13px; cursor: pointer; transition: opacity .13s, border-color .13s; }
  .cl-shard:hover { border-color: var(--text-faint); }
  .cl-shard.dim { opacity: .45; }
  .cl-shard-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  .cl-shard-dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .cl-shard-head b { font-size: 12.5px; }
  .cl-shard-slots { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .cl-shard-rep { font-size: 9.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-faint); }
  .cl-shard-rep.bad { color: var(--danger); }
  .cl-node { display: flex; align-items: flex-start; gap: 8px; padding: 7px 0; border-top: 1px solid var(--border); }
  .cl-node.bad { background: color-mix(in oklab, var(--warn) 7%, transparent); margin: 0 -13px; padding: 7px 13px; }
  .cl-node .m-icon, .cl-node .msym { margin-top: 1px; flex: none; }
  .cl-node-main { flex: 1; min-width: 0; }
  .cl-node-line { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .cl-node-addr { font-family: var(--mono); font-size: 11.5px; color: var(--text); }
  .cl-role { font-family: var(--mono); font-size: 8.5px; letter-spacing: .05em; text-transform: uppercase; border-radius: 4px; padding: 1px 5px; }
  .cl-role.master { color: var(--accent); background: color-mix(in oklab, var(--accent) 15%, transparent); }
  .cl-role.replica { color: var(--text-faint); background: var(--bg2); }
  .cl-lag { font-family: var(--mono); font-size: 9.5px; color: var(--warn); background: color-mix(in oklab, var(--warn) 14%, transparent); border-radius: 99px; padding: 0 6px; }
  .cl-node-meta { display: flex; gap: 11px; flex-wrap: wrap; font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); margin-top: 3px; }
  .cl-health { display: inline-flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 9.5px; flex: none; }

  .cl-cols { max-width: 1000px; margin-bottom: 14px; align-items: start; }
  .cl-clean { display: flex; gap: 9px; align-items: center; font-size: 11.5px; line-height: 1.55; color: var(--text-dim); }
  .cl-warn { display: flex; gap: 9px; align-items: flex-start; padding: 9px 10px; border-radius: 9px; margin-bottom: 7px; }
  .cl-warn .m-icon, .cl-warn .msym { margin-top: 1px; flex: none; }
  .cl-warn.error { background: color-mix(in oklab, var(--danger) 9%, transparent); border: 1px solid color-mix(in oklab, var(--danger) 28%, transparent); }
  .cl-warn.error > .m-icon, .cl-warn.error > .msym { color: var(--danger); }
  .cl-warn.warn { background: color-mix(in oklab, var(--warn) 9%, transparent); border: 1px solid color-mix(in oklab, var(--warn) 26%, transparent); }
  .cl-warn.warn > .m-icon, .cl-warn.warn > .msym { color: var(--warn); }
  .cl-warn.note { background: var(--bg0); border: 1px solid var(--border); }
  .cl-warn.note > .m-icon, .cl-warn.note > .msym { color: var(--text-faint); }
  .cl-warn-t { font-size: 12px; color: var(--text); }
  .cl-warn-d { font-size: 11px; line-height: 1.55; color: var(--text-dim); margin-top: 3px; }
  .cl-warn-f { display: flex; align-items: flex-start; gap: 5px; font-size: 10.5px; line-height: 1.5; color: var(--text-faint); margin-top: 5px; }
  .cl-warn-f .m-icon, .cl-warn-f .msym { margin-top: 1px; }

  .cl-res-in { display: flex; align-items: center; gap: 7px; background: var(--bg0); border: 1px solid var(--border); border-radius: 9px; padding: 6px 10px; }
  .cl-res-in:focus-within { border-color: var(--accent); }
  .cl-res-in input { flex: 1; min-width: 0; background: none; border: none; outline: none; font-family: var(--mono); font-size: 12px; color: var(--text); }
  .cl-res-sugg { display: flex; gap: 4px; flex-wrap: wrap; margin: 7px 0 11px; }
  .cl-res-sugg button { font-family: var(--mono); font-size: 9.5px; color: var(--text-faint); background: none; border: 1px solid var(--border); border-radius: 5px; padding: 1px 6px; cursor: pointer; }
  .cl-res-sugg button.on, .cl-res-sugg button:hover { color: var(--text); border-color: var(--text-faint); }
  .cl-res-out { display: flex; flex-direction: column; gap: 1px; margin-bottom: 10px; }
  .cl-res-row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 3px 0; border-bottom: 1px dotted var(--border); }
